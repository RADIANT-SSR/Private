<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>RADIANT — Scripting</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ebeef2; --panel:#fafbfc; --panel-2:#f1f3f6; --panel-3:#e6e9ee; --panel-4:#dde1e8;
    --line:#cfd5de; --line-2:#b7bfcb; --ink:#1b2230; --ink-2:#384050;
    --muted:#6b7380; --muted-2:#8a93a1;
    --accent:#b8431a; --accent-soft:#f6e2d6;
    --ok:#2f7a3a; --ok-soft:#dcebdd;
    --warn:#a97c14; --warn-soft:#f5ebcf;
    --err:#a8302a; --err-soft:#f3dbd7;
    --focus:#2f5aa8; --focus-soft:#dde6f4;
    --code-kw:#8a2a8e; --code-str:#2f6b3a; --code-num:#a04018; --code-fn:#2a5abf; --code-com:#8a93a1;
  }
  body.dark{
    --bg:#0f1216; --panel:#171a21; --panel-2:#1d2029; --panel-3:#262a35; --panel-4:#323744;
    --line:#2b3140; --line-2:#3a4254; --ink:#e6e9ef; --ink-2:#c3c9d4;
    --muted:#8b94a4;
    --accent:#e08157; --accent-soft:#3a2218;
    --ok:#7fb987; --ok-soft:#1f2f22;
    --warn:#e0b249; --warn-soft:#3a2f16;
    --err:#e07874; --err-soft:#3a1e1c;
    --focus:#86a8df; --focus-soft:#1e2a3e;
    --code-kw:#d69fd8;--code-str:#97c49e;--code-num:#e0a075;--code-fn:#9bb8e3;--code-com:#6a7385;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.35}
  body{padding:20px 28px 28px;overflow-x:hidden}

  /* header */
  .ph{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px}
  .ph .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .ph .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--accent) 0%, var(--accent) 50%, var(--ink) 50%, var(--ink) 100%)}
  .ph h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .ph .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .ph .nav{flex:1;text-align:center;color:var(--muted);font-size:12px}
  .ph .nav kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;padding:1px 5px;border-radius:3px;color:var(--ink-2);margin:0 2px}

  /* app window */
  .app{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 8px 30px rgba(20,30,50,.08);overflow:hidden}
  .tb{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--ink-2)}
  .tb .dots{display:flex;gap:6px}
  .tb .dots i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .tb .dots i.r{background:#ec6a5e}.tb .dots i.y{background:#f4bf4f}.tb .dots i.g{background:#61c555}
  .tb .title{flex:1;text-align:center;font-weight:500;color:var(--ink)}
  .tb .title .sep{color:var(--muted);margin:0 6px}
  .tb .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--muted);white-space:nowrap}
  .mb{display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
  .mb > span{padding:4px 10px;cursor:default;color:var(--ink-2);border-radius:4px}
  .mb > span:hover{background:var(--panel-2)}

  /* workspace/scripting tab switcher */
  .tabs{display:flex;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel-2);gap:2px}
  .tabs .tab{padding:9px 18px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;display:flex;align-items:center;gap:7px}
  .tabs .tab:hover{color:var(--ink-2)}
  .tabs .tab.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
  .tabs .tab svg{width:13px;height:13px;flex-shrink:0}
  .tabs .spacer{flex:1}
  .tabs .session{padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .tabs .session .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}

  /* scripting toolbar */
  .stb{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .stb .btn{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .stb .btn:hover{background:var(--panel-3)}
  .stb .btn.primary{background:var(--ok);color:white;border-color:var(--ok)}
  .stb .btn.primary:hover{filter:brightness(1.05)}
  .stb .btn.warn{color:var(--err);border-color:var(--err-soft);background:var(--err-soft)}
  .stb .btn kbd{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:0 4px;border-radius:2px;background:rgba(0,0,0,.08);margin-left:2px}
  .stb .btn.primary kbd{background:rgba(255,255,255,.2)}
  .stb .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
  .stb .file-pick{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink)}
  .stb .file-pick .dirty{color:var(--accent);font-weight:700;margin-left:2px}
  .stb .spacer{flex:1}
  .stb .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}

  /* main grid */
  .grid{display:grid;grid-template-columns:240px 1fr 300px;grid-template-rows:1fr 200px;background:var(--bg)}
  .pane{background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
  .pane:last-child{border-right:none}
  .pane.left{grid-row:1 / 3}
  .pane.editor{}
  .pane.right{}
  .pane.console{grid-column:2 / 4;border-right:none}
  .pane-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .pane-h .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pane-h .act{color:var(--muted);font-size:11px;display:flex;gap:8px;font-weight:400;text-transform:none;letter-spacing:0}
  .pane-h .act span{cursor:pointer}
  .pane-h .act span:hover{color:var(--ink)}
  .pane-h .pill{font-size:10px;font-weight:500;padding:1px 6px;border-radius:8px;background:var(--panel-3);color:var(--ink-2);border:1px solid var(--line)}

  /* LEFT rail: files + chainstate */
  .sec{border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:none}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;user-select:none}
  .sec-h .caret{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-right:4px}
  .sec-body{padding:2px 0 8px}
  .file-item{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 24px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
  .file-item:hover{background:var(--panel-2)}
  .file-item.active{background:var(--focus-soft);color:var(--focus);border-left:2px solid var(--focus);padding-left:22px}
  .file-item .ic{color:var(--muted);width:14px;text-align:center}
  .file-item .dirty{color:var(--accent);margin-left:auto}

  /* chainstate tree */
  .ctree{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0 6px 6px}
  .ctree .node{display:flex;align-items:center;gap:4px;padding:2px 4px;cursor:pointer;border-radius:3px}
  .ctree .node:hover{background:var(--panel-2)}
  .ctree .node .t{color:var(--muted);width:12px;text-align:center;flex-shrink:0}
  .ctree .node .n{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctree .node .shape{color:var(--muted);margin-left:auto;font-size:10px;flex-shrink:0;padding-left:6px}
  .ctree .node .ty{color:var(--focus);font-size:10px;padding:0 4px;border:1px solid var(--focus);border-radius:2px;margin-left:4px;flex-shrink:0}
  .ctree .indent-1{padding-left:16px}
  .ctree .indent-2{padding-left:30px}
  .ctree .indent-3{padding-left:44px}
  .ctree .section-label{color:var(--ink);font-weight:600;margin-top:4px;padding:3px 4px;font-size:11px;border-bottom:1px solid var(--line);margin-bottom:3px}

  /* EDITOR */
  .ed-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
  .editor-area{flex:1;overflow:auto;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.65;position:relative;background:var(--panel);padding:0}
  .cell{border-bottom:1px solid var(--line);position:relative}
  .cell.active{background:var(--focus-soft)}
  .cell.active .cell-gutter{background:var(--focus-soft)}
  .cell-bar{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 52px;background:var(--panel-3);border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);font-family:'IBM Plex Sans',sans-serif}
  .cell.active .cell-bar{background:var(--focus-soft);color:var(--focus)}
  .cell-bar .run{cursor:pointer;color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:3px}
  .cell-bar .run:hover{text-decoration:underline}
  .cell-bar .n{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .cell-bar .sp{flex:1}
  .cell-bar .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px}
  .cell-body{display:flex}
  .cell-gutter{flex-shrink:0;width:52px;text-align:right;padding:8px 10px 8px 0;background:var(--panel-2);border-right:1px solid var(--line);font-size:11px;color:var(--muted);user-select:none}
  .cell-gutter .exec-marker{display:inline-block;padding:0 4px;color:var(--muted);font-size:10px}
  .cell-gutter .exec-marker.done{color:var(--ok)}
  .cell-code{flex:1;padding:8px 14px;white-space:pre;overflow-x:auto;min-width:0}
  .cell-code .empty-hint{color:var(--muted);font-style:italic;opacity:.6}

  /* code tokens */
  .k{color:var(--code-kw);font-weight:500}
  .s{color:var(--code-str)}
  .n{color:var(--code-num)}
  .f{color:var(--code-fn)}
  .c{color:var(--code-com);font-style:italic}
  .o{color:var(--ink-2)}
  .b{color:var(--ink);font-weight:600}

  /* RIGHT rail */
  .vars{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:0}
  .vars .row{display:grid;grid-template-columns:1fr 60px 80px;gap:6px;padding:5px 10px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer}
  .vars .row:hover{background:var(--panel-2)}
  .vars .row .nm{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vars .row .ty{color:var(--focus);font-size:10px;padding:1px 5px;border:1px solid var(--focus);border-radius:2px;text-align:center;justify-self:start}
  .vars .row .val{color:var(--muted);font-size:10.5px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vars .header-row{display:grid;grid-template-columns:1fr 60px 80px;gap:6px;padding:4px 10px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel-2)}

  /* snippets */
  .snips{padding:4px 10px 8px;display:flex;flex-direction:column;gap:4px}
  .snip{border:1px solid var(--line);border-radius:4px;padding:7px 10px;background:var(--panel-2);cursor:pointer;font-size:11.5px}
  .snip:hover{background:var(--panel-3);border-color:var(--line-2)}
  .snip .h{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .snip .h .ic{color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:11px}
  .snip .d{color:var(--muted);font-size:11px;margin-top:2px}
  .snip .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);margin-left:auto}

  /* figures dock */
  .figs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px}
  .fig{border:1px solid var(--line);border-radius:4px;background:var(--panel-2);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1.4}
  .fig:hover{border-color:var(--accent)}
  .fig .fh{padding:3px 6px;background:var(--panel-3);border-bottom:1px solid var(--line);font-size:9.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;display:flex;justify-content:space-between;align-items:center}
  .fig .fh .popout{color:var(--focus);font-size:11px}
  .fig .body{padding:4px;height:calc(100% - 22px)}
  .fig svg{width:100%;height:100%;display:block}
  .fig .prov{position:absolute;top:24px;right:5px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);background:var(--panel);padding:0 4px;border:1px solid var(--line);border-radius:2px;opacity:.85}

  /* console */
  .console-body{flex:1;overflow:auto;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;background:var(--panel);color:var(--ink-2)}
  .console-body .ln{padding:1px 0;white-space:pre-wrap;word-break:break-all}
  .console-body .ln.in{color:var(--ink)}
  .console-body .ln.in::before{content:">>> ";color:var(--focus);font-weight:600}
  .console-body .ln.out{color:var(--ink-2)}
  .console-body .ln.warn{color:var(--warn)}
  .console-body .ln.err{color:var(--err)}
  .console-body .ln.ok{color:var(--ok)}
  .console-body .ln.note{color:var(--muted);font-style:italic}
  .console-body .ln.banner{background:var(--focus-soft);color:var(--focus);padding:3px 6px;border-radius:3px;margin:3px 0;border-left:2px solid var(--focus)}
  .console-body .chip{font-size:10px;padding:1px 5px;border-radius:2px;background:var(--panel-3);color:var(--muted);margin-left:6px;border:1px solid var(--line);font-weight:500}
  .console-prompt{border-top:1px solid var(--line);padding:6px 12px;background:var(--panel-2);display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  .console-prompt .p{color:var(--focus);font-weight:600}
  .console-prompt input{flex:1;background:transparent;border:none;outline:none;font:inherit;color:var(--ink)}

  /* popout overlay */
  .popout-ov{position:fixed;inset:0;background:rgba(10,14,20,.6);z-index:120;display:none;align-items:center;justify-content:center;padding:40px}
  .popout-ov.show{display:flex}
  .popout-win{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(900px,92vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
  .popout-win .ph2{display:flex;align-items:center;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);gap:10px}
  .popout-win .ph2 .ttl{font-weight:600;flex:1}
  .popout-win .ph2 .close{cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
  .popout-win .body{padding:18px 22px;overflow:auto}
  .popout-win .figbig svg{width:100%;height:auto;display:block;max-height:560px}
  .popout-win .toolbar{padding:8px 14px;border-top:1px solid var(--line);background:var(--panel-2);display:flex;gap:8px;align-items:center;font-size:11.5px}
  .popout-win .toolbar .chip{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:2px 6px;background:var(--panel-3);border:1px solid var(--line);border-radius:3px}
  .popout-win .toolbar .sp{flex:1}
  .popout-win .toolbar .btn{padding:4px 10px;font-size:11.5px;border:1px solid var(--line);background:var(--panel);border-radius:3px;cursor:pointer;color:var(--ink-2)}

  /* status bar */
  .sb{display:flex;align-items:center;gap:14px;padding:6px 14px;border-top:1px solid var(--line);background:var(--panel-2);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .sb .ok{color:var(--ok)}.sb .warn{color:var(--warn)}
  .sb .sp{flex:1}
  .sb .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px;box-shadow:0 0 0 2px var(--ok-soft)}

  /* tweaks */
  .tweaks{position:fixed;right:22px;bottom:22px;z-index:100;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;box-shadow:0 8px 30px rgba(20,30,50,.15);font-size:12.5px;max-width:240px;display:none}
  .tweaks.show{display:block}
  .tweaks h3{margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .tweaks .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}
  .tweaks select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:3px;cursor:pointer}

  /* responsive-ish */
  @media (max-width:1300px){
    .pane.left{width:220px}
    .pane.right{width:280px}
  }
</style>
</head>
<body>

<div class="ph">
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>RADIANT</h1>
      <div class="sub">Scripting workspace · Python trade studies</div>
    </div>
  </div>
  <div class="nav">
    <kbd>⇧⏎</kbd> run cell · <kbd>⌃⏎</kbd> run & advance · <kbd>⌘B</kbd> run all · <kbd>⌘K</kbd> command palette
  </div>
</div>

<div id="root"></div>

<div class="popout-ov" id="popout">
  <div class="popout-win">
    <div class="ph2">
      <span class="ttl" id="po-title">Figure</span>
      <span class="close" onclick="document.getElementById('popout').classList.remove('show')">×</span>
    </div>
    <div class="body figbig" id="po-body"></div>
    <div class="toolbar">
      <span class="chip" id="po-run">run · #7f3a</span>
      <span class="chip" id="po-gen">generated · 14:32:18</span>
      <span class="sp"></span>
      <span class="btn">Pin to Workspace KPI strip</span>
      <span class="btn">Export PNG</span>
      <span class="btn">Copy code</span>
    </div>
  </div>
</div>

<div class="tweaks" id="tweaks">
  <h3>Tweaks</h3>
  <div class="row"><label>Script state</label>
    <select id="tw-state">
      <option value="live">Live bound</option>
      <option value="dirty">Modified (unsaved)</option>
      <option value="running">Running</option>
      <option value="err">Error</option>
    </select>
  </div>
  <div class="row"><label>Theme</label>
    <select id="tw-theme"><option value="light">Light</option><option value="dark">Dark</option></select>
  </div>
</div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "state": "live",
  "theme": "light",
  "focus": "source",
  "layout": "D"
}/*EDITMODE-END*/;
const LS_KEY="radiant_scripting";
const state = {...TWEAK_DEFAULTS, activeCell: 1, activeFile: "trade_aperture.py"};
try{const s=localStorage.getItem(LS_KEY);if(s)Object.assign(state,JSON.parse(s));}catch(_){}

// ---------- window chrome ----------
function chrome(){return `
  <div class="tb">
    <div class="dots"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="title">leo_mwir_clear.yaml<span class="sep">—</span>RADIANT v1.0.0</div>
    <div class="chip">#7f3a · git b4e0c1</div>
  </div>
  <div class="mb"><span>File</span><span>Edit</span><span>View</span><span>Run</span><span>Kernel</span><span>Tools</span><span>Help</span></div>
  <div class="tabs">
    <div class="tab" data-tab="ws"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>Workspace</div>

const CELL_1 = `<span class="c"># %% [markdown]</span>
<span class="c"># Trade study — find D* such that SNR(D) = 40 for the MWIR LEO scenario.</span>
<span class="c"># ps and result are pre-bound from the Workspace tab.</span>

<span class="k">from</span> <span class="o">radiant</span> <span class="k">import</span> chain, sweep, plot
<span class="k">import</span> <span class="o">numpy</span> <span class="k">as</span> np</span>

<span class="c"># sanity check: session-bound objects</span>
<span class="f">print</span>(<span class="s">f"Loaded: {ps.name} · result.snr = {result.snr:.2f}"</span>)
`;

const CELL_2 = `<span class="c"># %% sweep aperture 0.2 → 0.5 m · 8 points</span>
D = np.linspace(<span class="n">0.20</span>, <span class="n">0.50</span>, <span class="n">8</span>)

out = <span class="f">sweep</span>(
    ps,
    <span class="s">"sensor.optics.aperture_diameter"</span>, D,
    keep=[<span class="s">"snr"</span>, <span class="s">"nedt"</span>, <span class="s">"niirs"</span>, <span class="s">"mtf_nyq"</span>],
    recompute_from=<span class="s">"optics"</span>,  <span class="c"># reuse source+atm+platform</span>
)

out.<span class="f">head</span>()`;

const CELL_3 = `<span class="c"># %% locate D* at SNR = 40 threshold (linear interp)</span>
D_star = <span class="f">np.interp</span>(<span class="n">40.0</span>, out.snr, out.<span class="b">D</span>)
<span class="f">print</span>(<span class="s">f"D* = {D_star*1000:.1f} mm  → SNR crosses 40"</span>)

fig1 = <span class="f">plot.sweep</span>(out, x=<span class="s">"D"</span>, y=<span class="s">"snr"</span>, mark=(D_star, <span class="n">40.0</span>),
                  title=<span class="s">"SNR vs aperture"</span>, xlabel=<span class="s">"D (m)"</span>, threshold=<span class="n">40</span>)
fig1`;

fig2 = <span class="f">plot.histogram</span>(mc.snr, bins=<span class="n">40</span>, title=<span class="s">"SNR distribution"</span>, overlay=<span class="s">"mean+ci"</span>)
fig2`;

function render(){
  document.body.classList.toggle("dark", state.theme==="dark");
  document.getElementById("root").innerHTML = `
    <div class="app">
      ${chrome()}
      ${stb()}
      <div class="grid">
        ${leftPane()}
        ${editorPane()}
        ${rightPane()}
        ${consolePane()}
      </div>
      ${sb()}
    </div>`;

  // tab switcher -> jumps to Workspace file
  document.querySelectorAll(".tab[data-tab]").forEach(el=>{
    el.addEventListener("click", ()=>{
      if(el.dataset.tab==="ws"){
        // try to navigate to the mid-fi file in same directory
        window.location.href = "RADIANT Mid-fi.html#workspace";
      }
    });
  });

  // cell activation
  document.querySelectorAll(".cell[data-cell]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.activeCell = parseInt(el.dataset.cell,10);
      postEdit({activeCell:state.activeCell});
      render();
    });
  });

  // figure pop-out
  document.querySelectorAll(".fig[data-fig]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const n = el.dataset.fig;
      const ov = document.getElementById("popout");
      document.getElementById("po-title").textContent = n==="1"?"fig1 · SNR vs aperture":"fig2 · SNR distribution (500 MC)";
      document.getElementById("po-body").innerHTML = n==="1"?figSweep():figHist();
      document.getElementById("po-run").textContent = n==="1"?"run · #7f3a · sweep":"run · #7f3a · mc seed=42";
      document.getElementById("po-gen").textContent = n==="1"?"generated · 14:32:02":"generated · 14:32:18";
      ov.classList.add("show");
    });
  });

  // tweaks
  const sel = (id,v)=>{const e=document.getElementById(id); if(e) e.value=v};
  sel("tw-state", state.state); sel("tw-theme", state.theme);

  try{localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(_){}
}

function postEdit(edits){try{window.parent.postMessage({type:'__edit_mode_set_keys',edits},'*');}catch(_){}}
window.addEventListener("message", e=>{
  const d=e.data||{};
  if(d.type==="__activate_edit_mode") document.getElementById("tweaks").classList.add("show");
  if(d.type==="__deactivate_edit_mode") document.getElementById("tweaks").classList.remove("show");
});
window.parent.postMessage({type:'__edit_mode_available'}, '*');

["state","theme"].forEach(k=>{
  document.body.addEventListener("change", e=>{
    if(e.target.id==="tw-"+k){state[k]=e.target.value;postEdit({[k]:e.target.value});render();}
  });
});

// ESC closes pop-out
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") document.getElementById("popout").classList.remove("show");
});

render();
</script>
