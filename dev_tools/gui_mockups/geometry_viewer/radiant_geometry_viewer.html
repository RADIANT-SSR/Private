<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RADIANT · Geometry Viewer</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0b0d12;
    --bg-2:#0e1118;
    --bg-3:#11151d;
    --bg-4:#161b25;
    --line:#1f2530;
    --line-2:#2a3242;
    --ink:#e8ecf2;
    --ink-dim:#8892a3;
    --ink-faint:#5a6271;
    --accent:#6ad1ff;
    --sun:#f5b942;
    --phi:#e667c8;
    --ok:#7fd49b;
    --canvas-grad: radial-gradient(ellipse at 50% 40%, #11151d 0%, #0b0d12 65%, #06080d 100%);
    --pill-bg:#0a0e16;
    --pill-active-bg:#10202c;
    --pill-active-border:#1f3a4d;
    --shadow-deep:#060810;
  }
  .rad-root[data-theme="light"]{
    --bg:#f5f3ec;
    --bg-2:#ece9df;
    --bg-3:#e3dfd2;
    --bg-4:#d8d4c5;
    --line:#cdc8b8;
    --line-2:#b0aa98;
    --ink:#161616;
    --ink-dim:#5a5346;
    --ink-faint:#8a8472;
    --accent:#0d6e9c;
    --sun:#c97a17;
    --phi:#a8358c;
    --ok:#3f8a55;
    --canvas-grad: radial-gradient(ellipse at 50% 40%, #fafaf2 0%, #f1eee2 65%, #e6e1d2 100%);
    --pill-bg:#ece9df;
    --pill-active-bg:#dde9f1;
    --pill-active-border:#9bb6c8;
    --shadow-deep:#bfb9a6;
  }
  .rad-root[data-theme="light"]{ background:#fafaf2; }
  .rad-root[data-theme="light"] .rad-topbar{
    background:linear-gradient(180deg,#ece9df,#e3dfd2);
  }
  .rad-root[data-theme="light"] .rad-canvas{
    background:var(--canvas-grad);
  }
  .rad-root[data-theme="light"] .rad-legend{ background:rgba(250,250,242,.85); }
  .rad-root[data-theme="light"] .rad-status{ background:#e6e1d2; }
  .rad-root[data-theme="light"] .rad-num,
  .rad-root[data-theme="light"] .rad-numwrap,
  .rad-root[data-theme="light"] .rad-shape,
  .rad-root[data-theme="light"] .rad-pill,
  .rad-root[data-theme="light"] .rad-statuspill,
  .rad-root[data-theme="light"] .rad-orbit-hint span,
  .rad-root[data-theme="light"] .rad-btn{ background:var(--pill-bg); }
  .rad-root[data-theme="light"] .rad-pill-active,
  .rad-root[data-theme="light"] .rad-shape.active{
    background:var(--pill-active-bg);
    border-color:var(--pill-active-border);
  }
  .rad-root[data-theme="light"] .rad-tab.active{ background:var(--bg); }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#05070b;color:var(--ink);
    font:13px/1.45 Inter, ui-sans-serif, system-ui, sans-serif;}
  #root{height:100vh;display:flex;flex-direction:column;}

  .rad-root{display:flex;flex-direction:column;height:100vh;width:100vw;background:var(--bg);}
  .rad-shell{flex:1;display:flex;min-height:0;}

  /* Top bar */
  .rad-topbar{display:flex;align-items:center;gap:18px;padding:0 14px;
    height:38px;background:linear-gradient(180deg,#13171f,#0d1119);
    border-bottom:1px solid #060810;}
  .rad-brand{display:flex;align-items:center;gap:10px;}
  .rad-logo{width:18px;height:18px;background:
    conic-gradient(from 0deg, var(--sun) 0 60deg, transparent 60deg 180deg, var(--accent) 180deg 240deg, transparent 240deg 360deg);
    border-radius:50%;box-shadow:inset 0 0 0 1px #0b0d12, 0 0 8px rgba(245,185,66,.35);}
  .rad-brand-name{font-weight:700;letter-spacing:.18em;font-size:12px;}
  .rad-brand-sub{color:var(--ink-faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;}
  .rad-menu{display:flex;gap:14px;margin-left:8px;}
  .rad-menu-item{color:var(--ink-dim);font-size:12px;cursor:default;}
  .rad-menu-item:hover{color:var(--ink);}
  .rad-statuspill{margin-left:8px;display:flex;align-items:center;gap:8px;
    padding:4px 10px;border-radius:999px;background:#0a0e16;border:1px solid var(--line);
    color:var(--ink-dim);font-family:JetBrains Mono, monospace;font-size:11px;}
  .rad-led{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 6px var(--ok);}

  /* Theme segmented control */
  .rad-theme-seg{margin-left:auto;display:inline-flex;align-items:center;
    background:#0a0e16;border:1px solid var(--line);border-radius:6px;
    padding:2px;gap:0;}
  .rad-theme-btn{appearance:none;background:transparent;border:0;
    color:var(--ink-faint);padding:3px 8px;border-radius:4px;cursor:pointer;
    font:inherit;font-size:11px;letter-spacing:.04em;
    display:inline-flex;align-items:center;gap:6px;}
  .rad-theme-btn:hover{color:var(--ink-dim);}
  .rad-theme-btn.active{background:var(--bg-3);color:var(--ink);
    box-shadow:inset 0 0 0 1px var(--line-2);}
  .rad-theme-btn svg{flex-shrink:0;}
  .rad-root[data-theme="light"] .rad-theme-seg{background:#ece9df;}
  .rad-root[data-theme="light"] .rad-theme-btn.active{background:#fafaf2;}

  /* Left dock */
  .rad-left{width:200px;background:var(--bg-2);border-right:1px solid #060810;
    display:flex;flex-direction:column;}
  .rad-dock-tabs{display:flex;border-bottom:1px solid var(--line);}
  .rad-dt{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--ink-faint);
    letter-spacing:.08em;text-transform:uppercase;cursor:default;}
  .rad-dt-active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);}
  .rad-tree{flex:1;overflow:auto;padding:10px 4px;}
  .rad-tree-sec{margin-bottom:6px;}
  .rad-tree-sec-h{display:flex;align-items:center;gap:6px;padding:5px 10px;
    color:var(--ink-dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:default;}
  .rad-tri{display:inline-block;transition:transform .15s;font-size:9px;color:var(--ink-faint);}
  .rad-tri.open{transform:rotate(90deg);}
  .rad-tree-list{padding:2px 0 4px;}
  .rad-tree-item{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 26px;
    font-size:12px;color:var(--ink-dim);cursor:default;border-left:2px solid transparent;}
  .rad-tree-item:hover{color:var(--ink);background:rgba(255,255,255,.02);}
  .rad-tree-item.active{color:var(--ink);background:rgba(106,209,255,.07);
    border-left-color:var(--accent);}
  .rad-tree-icon{color:var(--ink-faint);width:14px;text-align:center;}

  /* Center column */
  .rad-center{flex:1;display:flex;flex-direction:column;min-width:0;}
  .rad-tabs{display:flex;height:30px;background:var(--bg-3);border-bottom:1px solid #060810;}
  .rad-tab{padding:0 18px;display:flex;align-items:center;font-size:12px;
    color:var(--ink-dim);border-right:1px solid var(--line);cursor:default;}
  .rad-tab.active{color:var(--ink);background:var(--bg);
    box-shadow:inset 0 2px 0 var(--accent);}
  .rad-canvas-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg);}

  /* Viewport toolbar */
  .rad-vtoolbar{display:flex;align-items:center;gap:24px;padding:8px 14px;
    border-bottom:1px solid var(--line);background:var(--bg-2);}
  .rad-vtools{display:flex;align-items:center;gap:6px;}
  .rad-vtools-label{color:var(--ink-faint);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;margin-right:4px;}
  .rad-btn{appearance:none;background:#0e1320;border:1px solid var(--line);
    color:var(--ink-dim);padding:5px 10px;border-radius:5px;font-size:11.5px;
    font-family:inherit;cursor:default;letter-spacing:.02em;}
  .rad-btn:hover{color:var(--ink);border-color:var(--line-2);}
  .rad-chip{display:inline-flex;align-items:center;gap:6px;}
  .rad-chip.active{background:#0b1622;}
  .rad-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  /* Canvas */
  .rad-canvas{flex:1;position:relative;min-height:0;
    background:var(--canvas-grad);
    cursor:grab;overflow:hidden;}
  .rad-canvas:active{cursor:grabbing;}
  .rad-scene-mount{position:absolute;inset:0;}
  .rad-scene-mount svg{width:100%;height:100%;display:block;}

  /* Legend */
  .rad-legend{position:absolute;left:14px;top:14px;background:rgba(11,13,18,.78);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px;
    font-family:JetBrains Mono, monospace;}
  .rad-legend-h{font-size:10px;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:6px;}
  .rad-legend-row{display:flex;align-items:center;gap:8px;font-size:11px;
    color:var(--ink-dim);padding:3px 4px;border-radius:4px;cursor:default;}
  .rad-legend-row:hover{color:var(--ink);background:rgba(255,255,255,.04);}
  .rad-legend-row.active{color:var(--ink);background:rgba(255,255,255,.06);}

  /* Scale note + orbit hint */
  .rad-scalenote{position:absolute;left:14px;bottom:12px;color:var(--ink-faint);
    font-family:JetBrains Mono, monospace;font-size:10.5px;letter-spacing:.14em;
    display:flex;align-items:center;gap:6px;}
  .rad-cross{color:var(--ink-faint);font-size:14px;line-height:1;}
  .rad-orbit-hint{position:absolute;right:14px;bottom:12px;color:var(--ink-faint);
    font-family:JetBrains Mono, monospace;font-size:10.5px;}
  .rad-orbit-hint span{display:inline-block;padding:1px 5px;background:#0a0e16;
    border:1px solid var(--line);border-radius:3px;margin-right:4px;font-size:10px;}

  /* Bottom status */
  .rad-status{display:flex;align-items:center;gap:14px;padding:6px 14px;
    background:#080a10;border-top:1px solid #060810;
    font-family:JetBrains Mono, monospace;font-size:11px;}
  .rad-status-cell{display:flex;align-items:center;gap:6px;color:var(--ink-dim);}
  .rad-status-cell em{color:var(--ink-faint);font-style:normal;font-size:10px;
    letter-spacing:.1em;}
  .rad-status-cell b{color:var(--ink);font-weight:500;}
  .rad-status-spacer{flex:1;}

  /* Right panel */
  .rad-right{width:270px;background:var(--bg-2);border-left:1px solid #060810;
    display:flex;flex-direction:column;overflow:hidden;}
  .rad-r-head{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid var(--line);
    font-size:11px;letter-spacing:.12em;color:var(--ink-dim);}
  .rad-live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);
    font-family:JetBrains Mono, monospace;font-size:10px;letter-spacing:.1em;}
  .rad-blip{width:6px;height:6px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 8px var(--ok);animation:blip 1.4s ease-in-out infinite;}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}

  .rad-readouts{display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border-bottom:1px solid var(--line);}
  .rad-readouts.compact .rad-readout{padding:8px 10px;}
  .rad-readout{background:var(--bg-2);padding:12px 12px;display:flex;flex-direction:column;gap:2px;
    position:relative;}
  .rad-readout::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:var(--rc);opacity:.55;}
  .rad-ro-lbl{font-family:JetBrains Mono, monospace;font-size:13px;font-weight:500;}
  .rad-ro-sub{font-size:10px;color:var(--ink-faint);letter-spacing:.06em;
    text-transform:uppercase;}
  .rad-ro-val{font-family:JetBrains Mono, monospace;font-size:18px;color:var(--ink);
    margin-top:2px;font-feature-settings:'tnum';}
  .rad-ro-val i{color:var(--ink-faint);font-style:normal;font-size:13px;margin-left:1px;}

  .rad-r-section{padding:10px 14px 4px;color:var(--ink-faint);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;}

  .rad-acc{border-bottom:1px solid var(--line);}
  .rad-acc-h{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:default;
    color:var(--ink-dim);font-size:12px;}
  .rad-acc.open .rad-acc-h{color:var(--ink);}
  .rad-acc-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .rad-acc-chev{margin-left:auto;color:var(--ink-faint);font-family:JetBrains Mono, monospace;}
  .rad-acc-body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:8px;}

  .rad-rpy-readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px;}
  .rad-rpy-cell{display:flex;flex-direction:column;gap:2px;padding:7px 8px;
    border:1px solid var(--line);border-left:2px solid var(--rc);border-radius:4px;
    background:#0a0e16;}
  .rad-rpy-cell em{font-style:normal;font-family:JetBrains Mono, monospace;font-size:9.5px;
    color:var(--ink-faint);letter-spacing:0.04em;}
  .rad-rpy-cell b{font-weight:500;font-size:11px;color:var(--ink);font-family:JetBrains Mono, monospace;}

  .rad-mode-row{display:flex;gap:6px;margin-bottom:4px;}
  .rad-pill{padding:3px 9px;border-radius:999px;border:1px solid var(--line);
    background:#0a0e16;font-size:10.5px;color:var(--ink-faint);
    letter-spacing:.04em;cursor:default;}
  .rad-pill-active{background:#10202c;color:var(--accent);border-color:#1f3a4d;}

  .rad-field{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rad-field label{font-size:11.5px;color:var(--ink-dim);}
  .rad-numwrap{display:flex;align-items:center;gap:4px;background:#0a0e16;
    border:1px solid var(--line);border-radius:5px;padding:2px 8px;}
  .rad-num{appearance:none;background:transparent;border:0;color:var(--ink);
    font-family:JetBrains Mono, monospace;font-size:12px;width:60px;text-align:right;outline:none;}
  .rad-num::-webkit-inner-spin-button{opacity:.4;}
  .rad-unit{color:var(--ink-faint);font-family:JetBrains Mono, monospace;font-size:10.5px;}
  .rad-hint{color:var(--ink-faint);font-family:JetBrains Mono, monospace;font-size:10px;
    border-top:1px dashed var(--line);padding-top:6px;}

  .rad-shape-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  .rad-shape{appearance:none;background:#0a0e16;border:1px solid var(--line);
    color:var(--ink-dim);padding:6px 8px;border-radius:5px;font-size:11px;
    font-family:inherit;cursor:default;display:flex;align-items:center;gap:6px;text-align:left;}
  .rad-shape:hover{color:var(--ink);}
  .rad-shape.active{color:var(--ink);background:#10202c;border-color:#1f3a4d;}
  .rad-shape-glyph{width:14px;text-align:center;font-size:13px;}

  /* SVG selection text */
  text{user-select:none;}
</style>

<script type="application/json" id="app-config">{}</script>

</svg>

</head>
