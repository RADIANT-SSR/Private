# RADIANT template: lwir_geo
# LWIR geostationary — 0.50m aperture, 8–12 µm
# Weather/environmental monitoring from GEO orbit.

source:
  target:
    temperature: 290.0        # K
    emissivity: 0.97

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 35786000.0  # m (GEO)

optics:
  aperture_diameter_m: 0.50   # m
  focal_length_m: 2.00        # m  (f/4.0)
  transmission_scalar: 0.65

detector:
  pixel_pitch_x_um: 25.0      # µm
  pixel_pitch_y_um: 25.0      # µm
  qe_value: 0.60
  dark_rate_e_per_s: 500.0    # e-/s

spectral_integration:
  filter_min_um: 8.0           # µm
  filter_max_um: 12.0          # µm
  integration_time_s: 0.020    # s

readout:
  read_noise_e_rms: 15.0      # e- RMS
  gain_e_per_dn: 2.0          # e-/DN
  adc_bits: 14
