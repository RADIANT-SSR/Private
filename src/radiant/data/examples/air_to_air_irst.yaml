# RADIANT config — written by Sensor.to_yaml()
_radiant:
  example:
    name: Air-to-Air IRST
    blurb: 'Two aircraft co-altitude at 10 km, head-on: a point-source detection-range
      problem through a level atmospheric path.'
    specs: MWIR 3.5–5 µm · 15 cm aperture · 10 km vs 10 km · point source
    tune_next:
    - source.target.range_m
    - detector.read_noise_e_rms
    - spectral_integration.integration_time_s
    provenance: adapted from scenarios/10_direction_general/10.2 (2026-09-08)
  format: 1
  wavelength_points: 500
atmosphere:
  aerosol_type: rural
  model: simple
  precipitable_water_cm: 2.92
  standard_atmosphere: midlat_summer
  visibility_km: 23.0
detector:
  dark_rate_e_per_s: 50000.0
  detector_temperature_K: 80.0
  fill_factor: 1.0
  pixel_pitch_x_um: 20.0
  pixel_pitch_y_um: 20.0
  qe_value: 0.8
geometry:
  ground_speed_m_s: 246.93312
  sensor_altitude_m: 10000.0
  solar_illumination: night
  target_altitude_m: 10000.0
  target_range_m: 50000.0
optics:
  aperture_diameter_m: 0.15
  focal_length_m: 0.45
  obscuration_ratio: 0.0
  transmission_scalar: 0.75
  # Warm-optics self-emission is OFF and that is a deliberate, temporary
  # statement, not a model claim (CU-380). Scalar transmission cannot carry the
  # term — a synthesized lump has no Kirchhoff emissivity — so the value here is
  # zero either way; this line makes the omission explicit instead of silent.
  #
  # For a thermal band the warm optics is usually the DOMINANT background, so
  # this is understated, not merely incomplete: declaring the same net tau as a
  # warm mirror train on RADIANT's MWIR example adds 37 % of signal in
  # background and drops SNR 17 %, and in a background-dominated point-source
  # case the same mechanism measured 19x. Before trusting a thermal-band SNR
  # from this file, replace `transmission_scalar` with an `optical_elements:`
  # train carrying each surface's `temperature_K`.
  #
  # Choosing those temperatures is an instrument-specific judgement, so it is
  # tracked as CU-380's open item rather than guessed here.
  nearfield_enabled: 0
  wfe_rms_waves: 0.05
performance:
  detection_snr_threshold: 5.0
readout:
  adc_bits: 14
  full_well_capacity_e: 1000000.0
  gain_e_per_dn: 61.0
  read_noise_e_rms: 40.0
source:
  scene_type: point_source
  target:
    point_intensity_area_m2: 0.36
    point_intensity_emissivity: 0.9
    point_intensity_temperature_K: 500.0
spectral_integration:
  filter_max_um: 5.0
  filter_min_um: 3.5
  integration_time_s: 0.0001
