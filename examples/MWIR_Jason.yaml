# RADIANT config — written by Sensor.save()
_radiant:
  format: 1
  wavelength_points: 500
atmosphere:
  interpolation_axes: sensor_altitude_m,target_altitude_m
  model: interpolated
  standard_atmosphere: midlat_summer
detector:
  dark_rate_e_per_s: 100.0
  pixel_pitch_x_um: 18.0
  pixel_pitch_y_um: 18.0
  qe_value: 0.7
geometry:
  sensor_altitude_m: 500000.0
  target:
    shape: flat_plate
    shape_length_m: 0.5
    shape_width_m: 0.1
  target_altitude_m: 20000.0
optics:
  aperture_diameter_m: 0.3
  focal_length_m: 1.2
  transmission_scalar: 0.7
readout:
  adc_bits: 16
  full_well_capacity_e: 2000000.0
  gain_e_per_dn: 32.0
  read_noise_e_rms: 5.0
source:
  scene_type: sub_pixel
  target:
    emissivity: 0.95
    temperature: 1000.0
spectral_integration:
  filter_max_um: 5.0
  filter_min_um: 3.5
  integration_time_s: 0.005
