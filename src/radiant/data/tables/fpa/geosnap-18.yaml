notes: >
  Cutoff is customer-specified (0.4-15 um); the band block records the product
  envelope, so set the study bandpass to the actual cutoff being modeled.
  Dark current is deliberately NOT set: the datasheet gives no number ('a
  function of cutoff wavelength and temperature', nA/cm2) - the schema default
  will apply and is almost certainly wrong for long cutoffs; set it per study.
  ROIC noise 40/400 e- is ROIC-only: the measured 13.2-um-cutoff science device
  (bowens2024) shows system read noise 360 e- RMS on a 2.75 Me- well, dark
  3.3e5 e-/s at 45 K, and QE 79.7 +/- 8.3 % at 10.6 um - prefer those values
  for LWIR studies. Wells are customizable (e.g. 90 ke- / 600 ke- for
  hyperspectral). Snapshot shutter, integrate-while-read (>97 % integration
  efficiency at 30 Hz); 100 Hz (2K x 2K) per leaflet2025.
