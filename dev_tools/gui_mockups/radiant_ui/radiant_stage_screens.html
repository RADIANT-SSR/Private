<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>RADIANT — Stage Screens</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ebeef2; --panel:#fafbfc; --panel-2:#f1f3f6; --panel-3:#e6e9ee;
    --line:#cfd5de; --line-2:#b7bfcb; --ink:#1b2230; --ink-2:#384050;
    --muted:#6b7380; --muted-2:#8a93a1;
    --accent:#b8431a; --accent-soft:#f6e2d6;
    --ok:#2f7a3a; --ok-soft:#dcebdd;
    --warn:#a97c14; --warn-soft:#f5ebcf;
    --err:#a8302a; --err-soft:#f3dbd7;
    --stale:#9aa3b0; --stale-soft:#e6e9ee;
    --focus:#2f5aa8; --focus-soft:#dde6f4;
  }
  body.dark{
    --bg:#0f1216; --panel:#171a21; --panel-2:#1d2029; --panel-3:#262a35;
    --line:#2b3140; --line-2:#3a4254; --ink:#e6e9ef; --ink-2:#c3c9d4;
    --muted:#8b94a4;
    --accent:#e08157; --accent-soft:#3a2218;
    --ok:#7fb987; --ok-soft:#1f2f22;
    --warn:#e0b249; --warn-soft:#3a2f16;
    --err:#e07874; --err-soft:#3a1e1c;
    --stale:#666b77; --stale-soft:#242832;
    --focus:#86a8df; --focus-soft:#1e2a3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.35}
  body{padding:20px 28px 28px;overflow-x:hidden}

  /* header */
  .ph{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px}
  .ph .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .ph .mark{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--accent) 0%, var(--accent) 50%, var(--ink) 50%, var(--ink) 100%)}
  .ph h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .ph .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .ph .tabs{display:flex;gap:2px;flex:1;margin-left:20px;border-bottom:1px solid var(--line);min-width:0}
  .ph .tabs button{font:inherit;font-weight:500;font-size:13px;background:transparent;border:1px solid transparent;border-bottom:none;color:var(--muted);padding:6px 12px;cursor:pointer;border-radius:5px 5px 0 0;white-space:nowrap;position:relative;top:1px}
  .ph .tabs button.active{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .ph .tabs button:hover:not(.active){color:var(--ink);background:var(--panel-2)}
  .ph .tabs .sp{flex:1}
  .ph .tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
  .ph .tools kbd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;padding:1px 5px;border-radius:3px;color:var(--ink-2)}

  /* app window */
  .app{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 8px 30px rgba(20,30,50,.08);overflow:hidden}
  .tb{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:12px;color:var(--ink-2)}
  .tb .dots{display:flex;gap:6px}
  .tb .dots i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .tb .dots i.r{background:#ec6a5e}.tb .dots i.y{background:#f4bf4f}.tb .dots i.g{background:#61c555}
  .tb .title{flex:1;text-align:center;font-weight:500;color:var(--ink)}
  .tb .title .sep{color:var(--muted);margin:0 6px}
  .tb .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--muted);white-space:nowrap}
  .mb{display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
  .mb > span{padding:4px 10px;cursor:default;color:var(--ink-2);border-radius:4px}
  .mb > span:hover{background:var(--panel-2)}

  /* chain strip */
  .chain{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  .stage{position:relative;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;min-height:76px;transition:all .12s}
  .stage:hover{border-color:var(--line-2);background:var(--panel-3)}
  .stage.active{background:var(--focus-soft);border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
  .stage.warn{background:var(--warn-soft);border-color:var(--warn)}
  .stage .num{position:absolute;top:-7px;left:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:0 6px;font-size:9.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted)}
  .stage .h{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stage .n{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .stage .t{font-size:14px;font-weight:600;margin-top:2px;color:var(--ink)}
  .stage .s{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
  .dot.err{background:var(--err);box-shadow:0 0 0 2px var(--err-soft)}
  .dot.stale{background:var(--stale);box-shadow:0 0 0 2px var(--stale-soft)}

  /* stage hero */
  .hero{display:flex;align-items:stretch;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);gap:18px}
  .hero .icon{width:56px;height:56px;border-radius:8px;background:var(--focus-soft);color:var(--focus);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;border:1px solid var(--focus)}
  .hero .lead{flex:1;min-width:0}
  .hero .crumb{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .hero .crumb .cur{color:var(--ink)}
  .hero h2{margin:2px 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
  .hero .desc{font-size:13px;color:var(--ink-2);max-width:900px}
  .hero .side{display:flex;gap:10px;align-items:center;flex-shrink:0}
  .hero .meta{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap}
  .hero .meta b{color:var(--ink)}

  /* body columns */
  .body{display:grid;grid-template-columns:280px 1fr 300px}
  .col{padding:14px 16px;border-top:1px solid var(--line);background:var(--panel);overflow:hidden}
  .col.mid{border-left:1px solid var(--line);border-right:1px solid var(--line)}

  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-width:0}
  .panel-h .t{font-size:11.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .panel-h .a{font-size:11px;color:var(--muted);white-space:nowrap}
  .panel-h .a span{cursor:pointer}
  .panel-h .a span:hover{color:var(--ink)}

  /* param tree (compact, stage-specific) */
  .prows{font-size:12.5px}
  .prow{display:grid;grid-template-columns:1fr 82px 34px;gap:6px;align-items:center;padding:3px 0}
  .prow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .v{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:right;padding:2px 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:3px;color:var(--ink)}
  .prow .u{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
  .prow.derived .v{background:var(--panel-3);color:var(--muted);border-style:dashed}
  .prow.tol .n::after{content:" ±σ";font-size:10px;color:var(--warn);font-family:'IBM Plex Mono',monospace}
  .prow.bad .v{border-color:var(--err);background:var(--err-soft);color:var(--err)}
  .group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px;font-weight:500;border-top:1px solid var(--line);padding-top:8px}
  .group-label:first-child{border-top:none;padding-top:0;margin-top:0}

  /* IO pipeline (right rail) */
  .io-block{margin-bottom:14px}
  .io-block h5{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
  .io-block h5 .arr{color:var(--ink-2)}
  .io-list{display:flex;flex-direction:column;gap:3px}
  .io-item{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;font-size:11.5px}
  .io-item .nm{font-family:'IBM Plex Mono',monospace;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
  .io-item .tag{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;white-space:nowrap}
  .io-item.out{border-color:var(--ok);background:var(--ok-soft)}
  .io-item.out .nm{color:var(--ok)}
  .io-item.in{border-color:var(--focus)}
  .io-item.noise{border-color:var(--accent);background:var(--accent-soft)}
  .io-item.noise .nm{color:var(--accent)}
  .io-item.mtf{border-color:var(--warn);background:var(--warn-soft)}

  /* viz area */
  .viz-big{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
  .viz-big .vh{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
  .viz-big .vh .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .viz-big .vh .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .viz-big .plot{min-height:200px}
  .viz-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .viz-grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

  /* metric cards (perf stage) */
  .mcard{padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  .mcard .mk{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
  .mcard .mv{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ink);margin:2px 0}
  .mcard .mv .u{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
  .mcard.primary{background:var(--accent-soft);border-color:var(--accent)}
  .mcard.primary .mv{color:var(--accent)}
  .mcard .trend{height:28px;margin-top:4px}

  /* data tables */
  .tbl{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:var(--panel-2)}
  .tbl .num{text-align:right}
  .bar{display:inline-block;height:8px;background:var(--accent);vertical-align:middle;border-radius:1px}

  /* text blocks / equations */
  .physbox{border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:10px 14px}
  .physbox h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
  .eq{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink);padding:3px 0;line-height:1.6}
  .eq .c{color:var(--muted)}
  .citeline{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}

  /* status bar */
  .sb{display:flex;align-items:center;gap:14px;padding:6px 14px;border-top:1px solid var(--line);background:var(--panel-2);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .sb .ok{color:var(--ok)}.sb .warn{color:var(--warn)}
  .sb .sp{flex:1}

  /* tweaks */
  .tweaks{position:fixed;right:22px;bottom:22px;z-index:100;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;box-shadow:0 8px 30px rgba(20,30,50,.15);font-size:12.5px;max-width:240px;display:none}
  .tweaks.show{display:block}
  .tweaks h3{margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .tweaks .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}
  .tweaks select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:3px;cursor:pointer}

  /* heatmap square (for PSF) */
  .heatmap{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .heatmap svg{width:100%;height:100%;display:block}

  /* small pill group */
  .pills{display:flex;flex-wrap:wrap;gap:4px}
  .pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
  .pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .pill.accent{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  /* diagram lines */
  .diagram{border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:10px}

  /* arrows between chain nodes (subtle) */
  .stage + .stage::before{content:"";position:absolute;left:-8px;top:50%;width:8px;height:1px;background:var(--line-2)}

  /* ---------- scenario crumb header (above stage body) ---------- */
  .scn-bar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .scn-bar .label{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
  .scn-bar .crumb{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;flex-wrap:wrap;gap:0}
  .scn-bar .crumb .v{padding:1px 6px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
  .scn-bar .crumb .v.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .scn-bar .crumb .sep{color:var(--muted-2);padding:0 4px}
  .scn-bar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
  .scn-bar .preset-pop{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border:1px solid var(--line);background:var(--panel);border-radius:4px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .scn-bar .preset-pop:hover{background:var(--panel-3)}
  .scn-bar .preset-pop .ic{color:var(--muted);margin-right:4px}

  /* ---------- viz tabs (inside center column) ---------- */
  .viz-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:-14px -16px 12px;padding:0 16px;background:var(--panel-2)}
  .viz-tabs button{font:inherit;font-size:12px;padding:7px 14px;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);position:relative;top:1px;white-space:nowrap}
  .viz-tabs button.on{color:var(--accent);border-color:var(--accent);font-weight:500}
  .viz-tabs button:hover:not(.on){color:var(--ink)}
  .viz-tabs .sp{flex:1}
  .viz-tabs .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);padding:9px 0}

  /* ---------- params · enriched widgets ---------- */
  .gh{display:flex;align-items:center;gap:6px;margin:14px 0 6px;color:var(--ink);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line);padding-top:10px}
  .gh:first-child{border-top:none;padding-top:0;margin-top:0}
  .gh .chev{color:var(--muted);font-family:'IBM Plex Mono',monospace;width:10px;display:inline-block}
  .gh .badge{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px;background:var(--panel-3);border:1px solid var(--line);border-radius:3px;color:var(--muted);text-transform:none;font-weight:500;letter-spacing:0}
  .gh .badge.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .gh .badge.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
  .gh .badge.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  .seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel-2);width:100%}
  .seg button{flex:1;font:inherit;font-size:11px;padding:3px 5px;background:transparent;border:none;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--ink);color:var(--panel)}
  body.dark .seg button.on{background:var(--ink-2);color:var(--panel)}

  .filechip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:3px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:right}
  .filechip:hover{background:var(--panel-3)}

  .spec-cards{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .spec-card{display:grid;grid-template-columns:16px 1fr;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);cursor:pointer;align-items:flex-start}
  .spec-card:hover{background:var(--panel-3)}
  .spec-card.on{background:var(--accent-soft);border-color:var(--accent)}
  .spec-card.disabled{opacity:.45;cursor:not-allowed;background:var(--panel-2)}
  .spec-card .rb{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);margin-top:2px;position:relative;flex-shrink:0}
  .spec-card.on .rb{border-color:var(--accent)}
  .spec-card.on .rb::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--accent)}
  .spec-card .name{font-size:11.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .spec-card .name .code{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;color:var(--muted);background:var(--panel);padding:0 5px;border:1px solid var(--line);border-radius:3px}
  .spec-card .formula{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
  .spec-card.on .name .code{background:var(--panel);border-color:var(--accent)}

  /* ---------- descriptor cards (right rail) ---------- */
  .descriptor-card{margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-2)}
  .descriptor-card .dh{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:10.5px;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .descriptor-card .dh .badge{font-family:'IBM Plex Mono',monospace;font-size:9.5px;padding:1px 5px;background:var(--panel-3);border:1px solid var(--line);border-radius:2px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:auto}
  .descriptor-card .dr{display:flex;justify-content:space-between;padding:1px 0;gap:8px}
  .descriptor-card .dr .k{color:var(--muted);flex-shrink:0}
  .descriptor-card .dr .v{color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .descriptor-card .dr .v.acc{color:var(--accent);font-weight:500}
  .descriptor-card .dr .v.warn{color:var(--warn)}
  .descriptor-card .dr .v.err{color:var(--err)}

  /* ---------- validation summary + items ---------- */
  .val-summary{display:flex;gap:6px;margin-bottom:10px;font-size:11px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap}
  .val-summary .pill{padding:2px 7px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;gap:4px;background:var(--panel-2);color:var(--muted)}
  .val-summary .pill.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}

        <div class="mcard"><div class="mk">MTF @ ν_nyq</div><div class="mv">0.42</div><div class="trend">${plotSparkline()}</div></div>
        <div class="mcard"><div class="mk">RER</div><div class="mv">0.28</div><div class="trend">${plotSparkline()}</div></div>
      </div>
    </div>

    <div class="body">
      <div class="col">
        <div class="panel-h"><span class="t">Performance · descriptor</span></div>

        <div class="gh"><span class="chev">▾</span>Targets<span class="badge acc">P1</span></div>
        <div class="prows">
          <div class="prow"><span class="n">SNR threshold</span><span class="v">40</span><span class="u"></span></div>
          <div class="prow"><span class="n">NEDT threshold</span><span class="v">30</span><span class="u">mK</span></div>
          <div class="prow"><span class="n">NIIRS target</span><span class="v">5.0</span><span class="u"></span></div>
        </div>

        <div class="gh"><span class="chev">▾</span>Models<span class="badge">M1 GIQE5</span></div>
        <div class="prows">
          <div class="prow"><span class="n">NIIRS model</span><span class="v">GIQE5</span><span class="u"></span></div>
          <div class="prow"><span class="n">detection</span><span class="v">johnson-nvl</span><span class="u"></span></div>
          <div class="prow"><span class="n">EE box r</span><span class="v">0.5</span><span class="u">px</span></div>
        </div>

        <div class="gh"><span class="chev">▾</span>Range<span class="badge">R1</span></div>
        <div class="prows">
          <div class="prow"><span class="n">P_detect</span><span class="v">0.80</span><span class="u"></span></div>
          <div class="prow"><span class="n">P_recognize</span><span class="v">0.50</span><span class="u"></span></div>
          <div class="prow"><span class="n">P_identify</span><span class="v">0.30</span><span class="u"></span></div>
        </div>
      </div>

      <div class="col mid">
        ${vizTabs(["SNR · sweep","System MTF","Equations","Targets"], "GIQE5 · 8 noise terms · 500 λ")}
        <div class="viz-grid2" style="margin-bottom:10px">
          <div class="viz-big">
            <div class="vh"><span class="t">SNR vs aperture (last sweep)</span><span class="m">D* = 0.31 m @ SNR=40</span></div>
            <div class="plot" style="height:200px">${plotSweep()}</div>
          </div>
          <div class="viz-big">
            <div class="vh"><span class="t">System MTF</span><span class="m">ν_nyq · RER</span></div>
            <div class="plot" style="height:200px">${plotMTF()}</div>
          </div>
        </div>

        <div class="viz-grid2">
          <div class="physbox">
            <h5>SNR · NEDT</h5>
            <div class="eq">SNR = N_sig / √Σ σ²ᵢ</div>
            <div class="eq">NEDT = σ_total / (∂N/∂T)</div>
            <div class="eq">∂N/∂T · via finite diff on source at ±0.5 K</div>
          </div>
          <div class="physbox">
            <h5>NIIRS · GIQE5 (EO), IIRS (IR)</h5>
            <div class="eq">NIIRS = 9.57 + c·log(GSD) + ... </div>
            <div class="eq">  · MTF @ ν_nyq · RER · SNR</div>
            <div class="citeline">refs: IRARS GIQE5 · Leachtenauer 1997</div>
          </div>
          <div class="physbox">
            <h5>Detection range</h5>
            <div class="eq">R_det = f(char size, MRC, SNR, P_det)</div>
            <div class="eq">target 1m @ P=0.8 → <b>4.2 km</b></div>
          </div>
          <div class="physbox">
            <h5>RER</h5>
            <div class="eq">RER = ½·|ESF(+½) − ESF(−½)|</div>
            <div class="eq">proxy for ground-sampled resolution</div>
          </div>
        </div>

        <div style="margin-top:10px">
          <div class="panel-h"><span class="t">Targets · pass / fail</span></div>
          <table class="tbl">
            <tr><th>metric</th><th class="num">actual</th><th class="num">target</th><th>status</th></tr>
            <tr><td>SNR</td><td class="num">47.3</td><td class="num">≥ 40</td><td><span class="pill ok">PASS</span></td></tr>
            <tr><td>NEDT</td><td class="num">23 mK</td><td class="num">≤ 30 mK</td><td><span class="pill ok">PASS</span></td></tr>
            <tr><td>NIIRS</td><td class="num">5.4</td><td class="num">≥ 5.0</td><td><span class="pill ok">PASS</span></td></tr>
            <tr><td>Detection range @ P=0.8</td><td class="num">4.2 km</td><td class="num">≥ 3.5 km</td><td><span class="pill ok">PASS</span></td></tr>
            <tr><td>MTF @ ν_nyq</td><td class="num">0.42</td><td class="num">≥ 0.35</td><td><span class="pill ok">PASS</span></td></tr>
            <tr><td>jitter_rms</td><td class="num">3.0 µrad</td><td class="num">≤ 2.0 µrad</td><td><span class="pill warn">WATCH</span></td></tr>
          </table>
        </div>
      </div>

      <div class="col">
        <div class="panel-h"><span class="t">Validation</span></div>
        ${valBlock(
          [["ok","✓ 5 pass"],["warn","⚠ 1 watch"],["info","i 1 info"]],
          [
            ["warn","V7.1","jitter_rms (3.0 µrad) exceeds spec (2.0 µrad). MTF_jitter contribution acceptable but should be tracked. Source: PlatformStage.","sensor.stabilization.jitter_rms"],
            ["info","V7.2","All 6 chain stages evaluated cleanly. 8 noise terms summed, 7 MTF terms multiplied. Provenance hash #7f3a9e2b.","perf.evaluation"],
          ]
        )}

        ${descSection("Descriptors emitted",2,
          descCard("ChainResult","#7f3a",[
            ["SNR","47.3","acc"],
            ["NEDT","23 mK","acc"],
            ["NIIRS","5.4","acc"],
            ["GSD","3.6 m"],
            ["MTF @ ν_nyq","0.42"],
            ["RER","0.28"],
            ["range @ P=0.8","4.2 km"],
          ]) +
          descCard("Provenance","attached",[
            ["run_id","#7f3a9e2b","acc"],
            ["radiant","1.0.0rc3"],
            ["git","b4e0c1"],
            ["tape7","4a7c…a1"],
            ["param sha","3d91…ea"],
          ])
        )}

        <div class="physbox" style="margin-top:8px">
          <h5>Next actions</h5>
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:12px">
            <span class="pill accent" style="cursor:pointer">⇄ Sweep any parameter</span>
            <span class="pill" style="cursor:pointer">🎲 Monte Carlo (σ tags)</span>
            <span class="pill" style="cursor:pointer">📄 Export 1-page summary PDF</span>
            <span class="pill" style="cursor:pointer">⧉ Diff vs last run</span>
          </div>
        </div>
      </div>
    </div>
    ${sb("All metrics evaluated · 6 targets · 5 PASS · 1 WATCH")}
  `;
}

const SCREENS = {source:stageSource, atm:stageAtm, optics:stageOptics, platform:stagePlatform, detector:stageDetector, readout:stageReadout, perf:stagePerf};

// ----- mount -----
const state = {...TWEAK_DEFAULTS};
try{ const s = localStorage.getItem(LS_KEY); if(s) Object.assign(state, JSON.parse(s));}catch(_){}
// honor #hash for cross-page navigation (e.g. RADIANT Stage Screens.html#optics)
const STAGE_KEYS = new Set(STAGES.map(s=>s.k));
const hashKey = (location.hash||"").replace("#","").trim();
if(STAGE_KEYS.has(hashKey)) state.stage = hashKey;
window.addEventListener("hashchange", ()=>{
  const k = (location.hash||"").replace("#","").trim();
  if(STAGE_KEYS.has(k)){ state.stage = k; postEdit({stage:k}); render(); }
});

function render(){
  document.body.classList.toggle("dark", state.theme==="dark");
  const root = document.getElementById("root");
  root.innerHTML = `<div class="app">${titleBar()}${chainStrip(state.stage)}${SCREENS[state.stage]()}</div>`;
  root.querySelectorAll(".stage[data-k]").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.stage = el.dataset.k;
      postEdit({stage:state.stage});
      render();
    });
  });
  const setSel = (id,v)=>{const e=document.getElementById(id); if(e) e.value=v};
  setSel("tw-stage", state.stage); setSel("tw-theme", state.theme);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state));}catch(_){}
}

window.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  const k = e.key;
  const map = {"1":"source","2":"atm","3":"platform","4":"optics","5":"detector","6":"readout","7":"perf"};
  if(map[k]){ state.stage = map[k]; postEdit({stage:state.stage}); render(); }
});

function postEdit(edits){ try{ window.parent.postMessage({type:'__edit_mode_set_keys', edits}, '*');}catch(_){}}
window.addEventListener("message", e=>{
  const d=e.data||{};
  if(d.type==="__activate_edit_mode") document.getElementById("tweaks").classList.add("show");
  if(d.type==="__deactivate_edit_mode") document.getElementById("tweaks").classList.remove("show");
});
window.parent.postMessage({type:'__edit_mode_available'}, '*');

["stage","theme"].forEach(k=>{
  const el=document.getElementById("tw-"+k); if(!el) return;
  el.addEventListener("change", ()=>{ state[k]=el.value; postEdit({[k]:el.value}); render();});
});

render();
</script>
</body>
</html>
