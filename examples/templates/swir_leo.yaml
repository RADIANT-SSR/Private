# RADIANT template: swir_leo
# SWIR LEO mapper — 0.25m aperture, 1.0–2.5 µm
# Mineral mapping, cloud-penetrating imagery from LEO.

source:
  target:
    temperature: 300.0        # K
    emissivity: 0.90

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 500000.0  # m (500 km LEO)

optics:
  aperture_diameter_m: 0.25   # m
  focal_length_m: 1.00        # m  (f/4.0)
  transmission_scalar: 0.75

detector:
  pixel_pitch_x_um: 15.0      # µm
  pixel_pitch_y_um: 15.0      # µm
  qe_value: 0.75
  dark_rate_e_per_s: 50.0     # e-/s

spectral_integration:
  filter_min_um: 1.0           # µm
  filter_max_um: 2.5           # µm
  integration_time_s: 0.010    # s

readout:
  read_noise_e_rms: 8.0       # e- RMS
  gain_e_per_dn: 1.0          # e-/DN
  adc_bits: 14
