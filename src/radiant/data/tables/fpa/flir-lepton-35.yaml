notes: >
  NEDT record: thermal sensitivity < 50 mK (ds2018) - measured as a module
  with the integral f/1.1 lens; unlike the Lynred/Boson+ specs the scene
  temperature and gain-state conditions are not printed on this datasheet.
  Thermal time constant 'on the order of 12 msec' (eng_radiometry Sec. 9.0)
  - that engineering document is written for the 80x60 / 17 um Lepton 2.x
  with-radiometry module, so the 12 ms is a FAMILY INFERENCE for the 3.5's
  12 um pixel, not a measured 3.5 value. Radiometric accuracy: greater of
  +/-5 degC or 5 % (high gain); +/-10 degC or 10 % (low gain). Scene
  dynamic range: high gain -10 to +140 degC; low gain -10 to +400 degC
  (+450 degC typical). Effective frame rate 8.7 Hz keeps the module under
  the 9 Hz export threshold. Integral shutter NUC; solar protection;
  video-over-SPI; ~150 mW operating (650 mW during shutter event). FOV 57
  deg horizontal / 71 deg diagonal through the f/1.1 lens. RADIANT has no
  NEDT / thermal-time-constant detector inputs yet (Gap 101), so SNR/NEDT
  predictions must come from the NEDT-specified path once that lands.
