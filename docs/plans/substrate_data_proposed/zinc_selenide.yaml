substrate: 1
name: zinc_selenide
formula: ZnSe
aliases: [znse, zinc selenide, zinc_selenide]
window_um: [0.60, 14.00]
reference_temperature_K: 296
description: >
  CVD polycrystalline zinc selenide (the "Raytran" / IRTRAN-4 lineage). The
  widest useful window of the candidate set (0.6-21 um) and the lowest window
  absorption of any IR substrate -- it is the CO2-laser-optics material
  precisely because alpha is ~5e-4 cm^-1 at 10.6 um. The best-provenanced
  alpha(lambda) in this library: five published laser-line anchors spanning
  1.3-10.6 um.

n_refr:
  kind: formula
  formula: sellmeier_1
  coefficients: [0, 4.45813734, 0.200859853, 0.467216334, 0.391371166, 2.89566290, 47.1362108]
  valid_um: [0.54, 18.2]
  source: connolly1979
  note: "Checks against Crystran's published n = 2.4028 at 10.6 um."

alpha:
  unit: cm^-1
  grade_sensitivity: "~2x (CVD lot)"
  interpolation: log10-log10 through anchors
  anchors:
    - {lambda_um: 1.3, alpha_cm_inv: 0.005, source: crystran_znse, basis: "published laser-line value"}
    - {lambda_um: 2.7, alpha_cm_inv: 0.0007, source: crystran_znse, basis: "published laser-line value"}
    - {lambda_um: 3.8, alpha_cm_inv: 0.0004, source: crystran_znse, basis: "published laser-line value"}
    - {lambda_um: 5.25, alpha_cm_inv: 0.0004, source: crystran_znse, basis: "published laser-line value"}
    - {lambda_um: 10.6, alpha_cm_inv: 0.0005, source: crystran_znse, basis: "published laser-line value"}
  temperature_note: "Wide-gap II-VI; no free-carrier term in any EO operating range."

sources:
  connolly1979:
    type: paper
    title: "Specifications of Raytran material / Fitting refractive-index data with the Sellmeier dispersion formula"
    authors: "J. Connolly, B. diBenedetto, R. Donadio (data); B. Tatian (fit)"
    venue: "Proc. SPIE 181, 141-144 (1979); Appl. Opt. 23, 4477-4485 (1984)"
    doi: 10.1364/AO.23.004477
    retrieved_via: "refractiveindex.info database (CC0), main/ZnSe/nk/Connolly.yml"
    url: "https://refractiveindex.info/?shelf=main&book=ZnSe&page=Connolly"
  crystran_znse:
    type: manufacturer_page
    title: "Zinc Selenide (ZnSe) optical material"
    publisher: "Crystran Ltd"
    url: "https://www.crystran.co.uk/optical-materials/zinc-selenide-znse"
    local_copy: sources/zinc-selenide-znse.txt
