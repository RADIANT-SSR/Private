# RADIANT config — written by Sensor.to_yaml()
_radiant:
  example:
    name: MWIR Maritime Surveillance
    blurb: A 500 km MWIR pushbroom hunting a sub-pixel ship against a 288 K sea — the
      classic space-EO detection budget.
    specs: MWIR 3.5–5 µm · 30 cm aperture · 500 km LEO · sub-pixel target
    tune_next:
    - spectral_integration.integration_time_s
    - optics.aperture_diameter_m
    - geometry.path_zenith_rad
    provenance: adapted from scenarios/01_sarah_systems_engineer/1.1 (2026-09-08; emissivity
      path re-based in-package)
  format: 1
  wavelength_points: 500
atmosphere:
  aerosol_type: maritime
  model: simple
  standard_atmosphere: midlat_summer
detector:
  dark_rate_e_per_s: 50000.0
  detector_temperature_K: 77.0
  pixel_pitch_x_um: 15.0
  pixel_pitch_y_um: 15.0
  qe_value: 0.7734760469011726
geometry:
  path_zenith_rad: 0.3490658503988659
  sensor_altitude_m: 500000.0
  target:
    projected_area_m2: 240.0
  target_range_m: 532088.886237956
optics:
  aperture_diameter_m: 0.3
  focal_length_m: 0.75
  transmission_scalar: 0.85
  # Warm-optics self-emission is OFF and that is a deliberate, temporary
  # statement, not a model claim (CU-380). Scalar transmission cannot carry the
  # term — a synthesized lump has no Kirchhoff emissivity — so the value here is
  # zero either way; this line makes the omission explicit instead of silent.
  #
  # For a thermal band the warm optics is usually the DOMINANT background, so
  # this is understated, not merely incomplete: declaring the same net tau as a
  # warm mirror train on RADIANT's MWIR example adds 37 % of signal in
  # background and drops SNR 17 %, and in a background-dominated point-source
  # case the same mechanism measured 19x. Before trusting a thermal-band SNR
  # from this file, replace `transmission_scalar` with an `optical_elements:`
  # train carrying each surface's `temperature_K`.
  #
  # Choosing those temperatures is an instrument-specific judgement, so it is
  # tracked as CU-380's open item rather than guessed here.
  nearfield_enabled: 0
performance:
  niirs:
    allow_extrapolated: true
readout:
  adc_bits: 14
  full_well_capacity_e: 8000000.0
  gain_e_per_dn: 500.0
  read_noise_e_rms: 30.0
source:
  background:
    material: water_calm
    temperature: 288.0
  regime_override: sub_pixel
  scene_type: sub_pixel
  target:
    emissivity_path: ../tables/emissivity/steel.csv
    temperature: 288.0
spectral_integration:
  filter_max_um: 5.0
  filter_min_um: 3.5
  integration_time_s: 0.005
