notes: >
  Mode-pinned preset: electron-domain values (well, read noise, dark) are EMVA
  1288 measurements at gain 0 dB with the package TEC stabilizing the sensor at
  15 C, in the LUCID Atlas SWIR ATP013S camera; Sony's own datasheet gives only
  mV-domain figures (sensitivity 121 mV, saturation 360 mV, Tj=15 C). Dark
  current is large at 15 C (~4 ke-/s) - deeper cooling reduces it strongly;
  rescale for cold-TEC studies. Global shutter; LUCID camera output is
  1280x1024 of the 1296x1032 effective array. Operability >99.5 % (Sony).
  196 e- read noise is the gain-0 (large-well) figure - higher analog gain
  modes trade well depth for lower read noise.
