fpa_preset: 1
name: flir-lepton-35
vendor: FLIR Systems (Teledyne FLIR)
model: Lepton 3.5 (P/N 500-0771-01)
part_class: uncooled_bolometer
material: uncooled VOx microbolometer
band: {label: LWIR, cut_on_um: 8.0, cut_off_um: 14.0}
description: >
  160x120, 12 um uncooled VOx micro thermal camera module with integral
  f/1.1 lens, radiometric output over the full 19,200-pixel array, and
  8.7 Hz export-compliant effective frame rate. Smartphone-class SWaP
  (~150 mW). No electron-domain quantities are published (expected for a
  bolometer); RADIANT models this class through the NEDT-specified path
  (Gap 101) - geometry/format/timing here, temperature-domain record in
  the notes.

