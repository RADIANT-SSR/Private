# RADIANT template: lwir_aerial_survey
# Airborne LWIR survey — 0.08m aperture, 8–13 µm
# Thermal mapping for agriculture, building inspection, wildfire.

source:
  target:
    temperature: 300.0        # K
    emissivity: 0.95

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 2000.0   # m

optics:
  aperture_diameter_m: 0.08   # m
  focal_length_m: 0.20        # m  (f/2.5)
  transmission_scalar: 0.60

detector:
  pixel_pitch_x_um: 17.0      # µm
  pixel_pitch_y_um: 17.0      # µm
  qe_value: 0.55
  dark_rate_e_per_s: 1000.0   # e-/s

spectral_integration:
  filter_min_um: 8.0           # µm
  filter_max_um: 13.0          # µm
  integration_time_s: 0.015    # s

readout:
  read_noise_e_rms: 20.0      # e- RMS
  gain_e_per_dn: 2.0          # e-/DN
  adc_bits: 14
