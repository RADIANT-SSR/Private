[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant"
version = "0.1.0"
description = "First-principles EO sensor performance modeling framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-qt>=4.2",
    "mypy>=1.7",
    "ruff>=0.1",
    "import-linter>=2.0",
    "hypothesis>=6.90",
    "h5py>=3.10",
]
# Scenario run scripts read/write vendor-format Excel workbooks (CU-057).
scenarios = [
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]
# Desktop GUI (RADIANT GUI v1, docs/plans/GUI_Development_Plan.md). Core RADIANT
# stays fully importable and runnable without this extra. The geometry viewer is a
# pure-Qt QPainter 2D schematic (ADR-0007, D7) — no PyVista/VTK/OpenGL dependency,
# so those pins were dropped (CU-134). qtconsole is retained for the deferred
# in-process Jupyter-kernel console path (CU-138); the shipped console is a REPL.
gui = [
    "PySide6>=6.6",
    "matplotlib>=3.8",
    "qtconsole>=5.5",
    "openpyxl>=3.1",  # GT-4 XLSX workbook export (owner D2, 2026-07-16)
]

[project.scripts]
radiant = "radiant.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--strict-markers"
markers = [
    "level0: Physics correctness tests (analytic result checks)",
    "level1: Module-level tests",
    "level2: End-to-end reference scenario tests",
    "golden: Golden regression tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
# CU-171: the strict gate is core+api (the modules passed on the command line).
# Without this pin, followed imports (gui, source, optics, ...) resolve as
# first-party source in a git worktree and get fully checked — surfacing ~120
# pre-existing errors outside the gate — while the primary checkout resolves
# them through the editable install and stays quiet. "silent" analyzes followed
# modules for type information but reports errors only for the listed files,
# making the gate identical in any checkout.
follow_imports = "silent" 
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1514 (unspecified-encoding) is a preview rule; enable it explicitly without
# turning on the rest of preview (Rule 30 — cp1252 mojibake guard, CU-149).
preview = true
explicit-preview-rules = true
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM", "PLW1514"]
ignore = []

[tool.importlinter]
root_package = "radiant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core has no radiant imports"
type = "forbidden"
source_modules = ["radiant.core"]
forbidden_modules = [
    "radiant.geometry",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
    "radiant.data",
    "radiant.gui",
]
ignore_imports = [
    # Test-colocation: the reflectance descriptor lives in core but its
    # canonical test fixtures (Lambertian, Phong) live in source. Tests
    # may reach across this seam.
    "radiant.core.tests.test_reflectance_descriptor -> radiant.source.brdf_lambertian",
    "radiant.core.tests.test_reflectance_descriptor -> radiant.source.brdf_phong",
]

[[tool.importlinter.contracts]]
name = "physics stages import only core"
type = "forbidden"
source_modules = [
    "radiant.geometry",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
forbidden_modules = [
    "radiant.io",
    "radiant.api",
    "radiant.cli",
    "radiant.gui",
]
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    # Test-colocation: physics-stage tests use api utilities (param
    # registry helpers, full-chain session fixtures, schema cross-checks).
    # Production stage code is not allowed to import api/io — these
    # exceptions cover the test seam only.
    "radiant.*.tests.* -> radiant.api._param_registry",
    "radiant.*.tests.* -> radiant.api.session",
    "radiant.*.tests.* -> radiant.api.sensor",
    "radiant.*.tests.* -> radiant.io.results",
    "radiant.*.tests.* -> radiant.io.config",
]

[[tool.importlinter.contracts]]
name = "no cross-stage physics imports"
type = "independence"
modules = [
    "radiant.geometry",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    # Test-colocation: physics-stage tests use cross-stage `_schema`
    # modules (parameter definitions) and api utilities to assemble
    # realistic full-chain fixtures. Production stage code remains
    # cross-stage independent — these exceptions cover the test seam only.
    "radiant.*.tests.* -> radiant.api._param_registry",
    "radiant.*.tests.* -> radiant.api.session",
    "radiant.*.tests.* -> radiant.geometry._schema",
    "radiant.*.tests.* -> radiant.source._schema",
    "radiant.*.tests.* -> radiant.atmosphere._schema",
    "radiant.*.tests.* -> radiant.optics._schema",
    "radiant.*.tests.* -> radiant.platform._schema",
    "radiant.*.tests.* -> radiant.spectral_integration._schema",
    "radiant.*.tests.* -> radiant.detector._schema",
    "radiant.*.tests.* -> radiant.readout._schema",
    "radiant.*.tests.* -> radiant.optics.psf.builder",
    "radiant.*.tests.* -> radiant.optics.psf.effective",
    "radiant.*.tests.* -> radiant.optics.psf_mono",
    "radiant.*.tests.* -> radiant.optics.sampling",
    "radiant.*.tests.* -> radiant.detector.noise.budget",
    "radiant.*.tests.* -> radiant.atmosphere.exo",
    "radiant.*.tests.* -> radiant.atmosphere.assembly",
]

[[tool.importlinter.contracts]]
name = "cli imports only api and io"
type = "forbidden"
source_modules = ["radiant.cli"]
forbidden_modules = [
    "radiant.core",
    "radiant.geometry",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
# CU-098: the contract's intent is that cli must not *directly* import
# physics/core — reaching them transitively through api/ and io/ is by
# design (CLAUDE.md import table: cli may import api + io; api imports all
# stages; io imports stages read-only for schema). `allow_indirect_imports`
# limits the check to direct cli edges, which retires the hand-maintained
# transitive ignore list that had fallen behind api/io's internal growth.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "gui imports only api and core"
type = "forbidden"
source_modules = ["radiant.gui"]
forbidden_modules = [
    "radiant.geometry",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.cli",
]
# The GUI is a view over the scripting API (GUI plan §4.1): gui may import
# radiant.api + radiant.core (+ external Qt/matplotlib/qtconsole), never a
# physics stage directly and never io/cli. api/ re-exports every physics
# stage, so an *indirect* gui -> api -> optics edge is by design; as with the
# cli contract (CU-098) `allow_indirect_imports` scopes the check to direct
# gui edges, keeping the two integration-layer contracts coherent.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "data imports only core"
type = "forbidden"
source_modules = ["radiant.data"]
forbidden_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
    "radiant.gui",
]
ignore_imports = [
    # Test-colocation: template smoke tests evaluate full sensors through
    # the public API. Production radiant.data code imports core only.
    "radiant.data.tests.test_templates -> radiant.api",
]
