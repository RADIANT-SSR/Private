# RADIANT template: vnir_aerial
# Visible/NIR aerial sensor — 0.15m aperture, 0.4–0.9 µm
# Airborne reconnaissance or mapping, reflective band.

source:
  target:
    temperature: 300.0        # K (ground target)
    emissivity: 0.10

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 3000.0   # m

optics:
  aperture_diameter_m: 0.15   # m
  focal_length_m: 0.60        # m  (f/4.0)
  transmission_scalar: 0.80

detector:
  pixel_pitch_x_um: 5.5       # µm
  pixel_pitch_y_um: 5.5       # µm
  qe_value: 0.85
  dark_rate_e_per_s: 10.0     # e-/s

spectral_integration:
  filter_min_um: 0.4           # µm
  filter_max_um: 0.9           # µm
  integration_time_s: 0.001    # s

readout:
  read_noise_e_rms: 3.0       # e- RMS
  gain_e_per_dn: 1.0          # e-/DN
  adc_bits: 14
