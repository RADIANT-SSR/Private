[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant-geometry-gui-v2"
version = "0.7.0"
description = "RADIANT Geometry — PyVista + PySide6 desktop module of the larger RADIANT GUI."
requires-python = ">=3.11"
authors = [{ name = "Jason Forsyth" }]
dependencies = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    # PySide6 6.5.x requires Python <3.12; 6.7+ supports 3.12 cleanly.
    "PySide6>=6.7",
    "numpy>=1.24",
    "qt-material>=2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-qt>=4",
    # No version floor: max published version on PyPI is 0.0.14.
    "pytest-image-diff",
]

[project.scripts]
radiant-geometry = "dev_tools.geometry_gui_v2.app.main:main"

# This package lives at dev_tools/geometry_gui_v2/ but exposes the
# `dev_tools.geometry_gui_v2` import path so the tests and `python -m`
# invocation lines in PLAN_v2.md work unchanged. We therefore root the
# package discovery two directories up (the repo root) and explicitly
# include the `dev_tools.geometry_gui_v2*` namespace.
[tool.setuptools.packages.find]
where = ["../.."]
include = ["dev_tools.geometry_gui_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
