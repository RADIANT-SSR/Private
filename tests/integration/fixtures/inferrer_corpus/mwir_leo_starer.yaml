# RADIANT template: mwir_leo_starer
# MWIR LEO staring array — 0.20m aperture, 3.0–5.0 µm
# Wide-field persistent surveillance from LEO.

source:
  target:
    temperature: 300.0        # K
    emissivity: 0.93

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 400000.0  # m (400 km LEO)

optics:
  aperture_diameter_m: 0.20   # m
  focal_length_m: 0.50        # m  (f/2.5)
  transmission_scalar: 0.68

detector:
  pixel_pitch_x_um: 24.0      # µm
  pixel_pitch_y_um: 24.0      # µm
  qe_value: 0.65
  dark_rate_e_per_s: 150.0    # e-/s

spectral_integration:
  filter_min_um: 3.0           # µm
  filter_max_um: 5.0           # µm
  integration_time_s: 0.003    # s

readout:
  read_noise_e_rms: 8.0       # e- RMS
  gain_e_per_dn: 1.0          # e-/DN
  adc_bits: 14
