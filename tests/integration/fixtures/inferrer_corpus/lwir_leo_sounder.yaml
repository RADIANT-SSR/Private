# RADIANT template: lwir_leo_sounder
# LWIR LEO atmospheric sounder — 0.15m aperture, 9.5–11.0 µm
# Narrowband thermal sounding for SST or atmospheric profiling.

source:
  target:
    temperature: 285.0        # K (sea surface)
    emissivity: 0.98

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 830000.0  # m (830 km)

optics:
  aperture_diameter_m: 0.15   # m
  focal_length_m: 0.45        # m  (f/3.0)
  transmission_scalar: 0.62

detector:
  pixel_pitch_x_um: 20.0      # µm
  pixel_pitch_y_um: 20.0      # µm
  qe_value: 0.55
  dark_rate_e_per_s: 800.0    # e-/s

spectral_integration:
  filter_min_um: 9.5           # µm
  filter_max_um: 11.0          # µm
  integration_time_s: 0.010    # s

readout:
  read_noise_e_rms: 12.0      # e- RMS
  gain_e_per_dn: 2.0          # e-/DN
  adc_bits: 14
