# RADIANT Documentation Configuration
#
# Build with:  mkdocs build
# Serve locally:  mkdocs serve
#
# Dependencies (doc-build only, NOT in install_requires):
#   pip install mkdocs mkdocs-material pymdown-extensions

site_name: RADIANT
site_description: First-principles EO sensor performance modeling
repo_url: https://github.com/example/radiant
repo_name: radiant

# The published site covers the user/developer-facing set (guides, theory,
# architecture, ADRs, validation, Operating Model). Repo-internal working
# docs — living registries, in-flight plans, point-in-time reports, and the
# historical archive — are repo-only (see docs/OPERATING_MODEL.md §1).
exclude_docs: |
  archive/**
  reports/**
  tracking/**
  plans/**

# Specs legitimately link to repo files outside docs/ (../src, ../tests,
# ../examples). Those are repo-relative references, not site links — report
# them at info level instead of failing the strict build.
validation:
  links:
    unrecognized_links: info
    absolute_links: info
    not_found: info

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: amber
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - User Guides:
    - Quickstart: guides/quickstart.md
    - Configuration: guides/configuration.md
    - Scripting: guides/scripting.md
    - Parameter Reference: guides/parameter_reference.md
    - Regime Selection: guides/regime_selection.md
    - Trade Studies: guides/trade_studies.md
    - Scenario Testing: guides/scenario_testing.md
    - Scenario Catalog: guides/scenario_catalog.md
  - Theory:
    - Radiometric Chain: theory/radiometric_chain.md
    - Geometry & Sampling: theory/geometry.md
    - Spatial Model: theory/spatial_model.md
    - Noise Model: theory/noise_model.md
    - Performance Metrics: theory/performance_metrics.md
    - References: theory/references.md
  - Developer:
    - Architecture: architecture/RADIANT_Master_Architecture.md
    - Signal Chain: architecture/RADIANT_Signal_Chain_Architecture.md
    - Conventions: architecture/RADIANT_Conventions.md
    - Parameters: architecture/RADIANT_Parameter_System.md
    - Testing: architecture/RADIANT_Testing_Validation.md
  - Architecture Reference:
    - Config Format: architecture/RADIANT_Config_Format.md
    - Scripting API: architecture/RADIANT_Scripting_API.md
    - Geometry Stage: architecture/RADIANT_Geometry.md
    - Source & Target System: architecture/RADIANT_Source_Target_System.md
    - Atmosphere: architecture/RADIANT_Atmosphere.md
    - Optics: architecture/RADIANT_Optics.md
    - Spatial Architecture: architecture/RADIANT_Spatial_Complete.md
    - Detector & Readout: architecture/RADIANT_Detector_Complete.md
    - Scan & Timing: architecture/RADIANT_Scan_Timing.md
    - Metrics: architecture/RADIANT_Metrics.md
    - Metric Dependencies: architecture/RADIANT_Metric_Dependencies.md
    - Use-Case Matrix: architecture/RADIANT_Use_Case_Matrix.md
    - Target Definition Matrix: architecture/RADIANT_Target_Definition_Matrix.md
    - Physics Inventory: architecture/RADIANT_Physics_Inventory.md
    - Scope Decisions: architecture/RADIANT_Scope_Decisions.md
    - Personas: architecture/RADIANT_Personas.md
    - File Tree: architecture/RADIANT_File_Tree.md
    - GUI Architecture (deferred): architecture/RADIANT_GUI_Architecture.md
    - Plugins (deferred): architecture/RADIANT_Plugins.md
  - Decision Records:
    - Index: adr/README.md
    - 0001 Scope and Constraints: adr/0001-scope-and-constraints.md
    - 0002 Option C Source/Atmosphere Split: adr/0002-option-c-source-atmosphere-split.md
    - 0003 T6 Tabulated at Source: adr/0003-t6-tabulated-at-source.md
    - 0004 T7 Intensity at Source: adr/0004-t7-intensity-at-source.md
    - ADR-A Fidelity Preset: adr/ADR-A-fidelity-preset.md
    - ADR-B Metric Soft-Fail: adr/ADR-B-metric-soft-fail.md
    - ADR-C Public API Surface: adr/ADR-C-public-api-surface.md
    - ADR-D Parameter Naming: adr/ADR-D-parameter-naming.md
  - Project:
    - Operating Model: OPERATING_MODEL.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
