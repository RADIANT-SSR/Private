notes: >
  Temperature-domain performance (eng2025, Table 13 + section 11.1): NEDT
  acceptance limit Industrial <=20 mK / Professional <=30 mK - random temporal
  noise (TVH), high-gain state, camera at 20 degC imaging a 30 degC
  background, averager disabled, free-running, LENSLESS with f/1.0 aperture;
  with a lens the limit scales by (f/#)^2 / tau_optics; the averager gives
  ~20 % lower NEDT. Thermal time constant nominally 8 ms (eng2025 Table 1).
  Operability >=99 % (Industrial). Radiometric accuracy +/-5 degC. RADIANT
  cannot yet hold NEDT / thermal-time-constant as detector inputs (no schema
  parameters; charge-well saturation checks also misapply to bolometers -
  Gap 101), so SNR/NEDT predictions for this preset must come from the
  NEDT-specified path once that gap lands; until then this preset supplies
  geometry/format/timing only. Spectral band printed as 8-14 um nominal.
