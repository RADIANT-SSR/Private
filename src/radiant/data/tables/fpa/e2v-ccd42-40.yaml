notes: >
  Datasheet is delisted from the vendor site; retrieved via the Internet
  Archive (Wayback, 2021-12-07 capture of the 2016 v9 document) - confirm
  current availability/version with Teledyne e2v before hardware decisions.
  Read noise is quoted at 253 K and 20 kHz in low-noise mode (4.5 uV/e-
  responsivity); maximum readout is 3 MHz with higher noise. Dark rate scales
  steeply with temperature per the note-2 law - at the 253 K typical operating
  point the AIMO dark is orders of magnitude below the 293 K figure. QE is the
  238 K minimum spec for the midband coating; broadband coating is 75 %
  midband. Analog output: no gain_e_per_dn or adc_bits set - they belong to
  the camera controller, not the CCD.
