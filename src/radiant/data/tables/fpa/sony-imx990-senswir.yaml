fpa_preset: 1
name: sony-imx990-senswir
vendor: Sony Semiconductor Solutions
model: IMX990 (SenSWIR; EMVA data from LUCID Atlas SWIR ATP013S)
part_class: swir
material: InGaAs photodiodes on Si readout circuit (Cu-Cu connection, SenSWIR)
band: {label: "VIS-SWIR 0.4-1.7 um", cut_on_um: 0.4, cut_off_um: 1.7}
description: >
  1296x1032 effective, 5 um pitch InGaAs-on-Si hybrid SWIR sensor with global
  shutter and on-chip 8/10/12-bit ADC; thermoelectric cooling element included
  in the package. Sensitive 0.4-1.7 um (visible response through the thinned
  InP). Electron-domain values are EMVA 1288 measurements of the sensor in the
  LUCID Atlas SWIR camera, pinned to gain 0 dB, TEC at 15 C, 12-bit ADC mode.

