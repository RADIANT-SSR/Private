# Mike's DROIC evaluation spec sheet (vendor-datasheet style, NON-canonical
# units on purpose — the runner converts at the boundary, Rule 2).
# The FPA and optics are identical to scenario 2.5's system; only the ROIC
# changes: the analog 2 Me- charge well vs a Senseeker-class digital-pixel
# (DROIC) readout with in-pixel 16-bit counters.

system:
  aperture_diameter_cm: 20.0        # cm
  focal_length_cm: 40.0             # cm
  optical_transmission_pct: 80.0    # %
  optics_temperature_C: 20.0        # deg C
  filter_cut_on_nm: 3500.0          # nm
  filter_cut_off_nm: 5000.0         # nm
  target_emissivity: 0.95           # -
  background_temperature_K: 290.0   # K
  background_emissivity: 0.95       # -

fpa:                                # shared by both ROICs
  pixel_pitch_um: 15.0              # um
  quantum_efficiency_pct: 72.0      # %
  dark_current_e_per_s: 100.0       # e-/s
  operating_temperature_K: 77.0     # K

analog_roic:                        # scenario 2.5's baseline ROIC
  read_noise_e_rms: 20.0            # e- RMS (post-CDS)
  full_well_capacity_Me: 2.0        # Me-
  adc_resolution_bits: 14           # bits
  system_gain_e_per_dn: 130.0       # e-/DN

droic:                              # Senseeker-class digital-pixel ROIC
  counting_chain_noise_e_rms: 20.0  # e- RMS per frame (reuses read_noise, ruling D3)
  counter_depth_bits: 16            # bits (in-pixel counter)
  charge_packet_ke: 4.5             # ke- per count (charge-subtraction quantum)
  residue_readout: true             # digitize sub-packet remainder
  residue_adc_bits: 14              # bits (residue ADC, full scale = one packet)
  max_count_rate_MHz: 5.0           # MHz (comparator dead-time ceiling)

study:
  integration_time_ms: 1.0          # ms (2.5's cold-target working point)
  scene_temperatures_K: [200.0, 250.0, 300.0, 400.0, 500.0, 700.0, 1000.0, 1500.0]  # K
