<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>RADIANT GUI — Mid-fidelity</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ebeef2;
    --panel:#fafbfc;
    --panel-2:#f1f3f6;
    --panel-3:#e6e9ee;
    --line:#cfd5de;
    --line-2:#b7bfcb;
    --ink:#1b2230;
    --ink-2:#384050;
    --muted:#6b7380;
    --muted-2:#8a93a1;
    --accent:#b8431a;     /* terracotta accent */
    --accent-soft:#f6e2d6;
    --ok:#2f7a3a;
    --ok-soft:#dcebdd;
    --warn:#a97c14;
    --warn-soft:#f5ebcf;
    --err:#a8302a;
    --err-soft:#f3dbd7;
    --stale:#9aa3b0;
    --stale-soft:#e6e9ee;
    --focus:#2f5aa8;
    --focus-soft:#dde6f4;
  }
  body.dark{
    --bg:#0f1216;
    --panel:#171a21;
    --panel-2:#1d2029;
    --panel-3:#262a35;
    --line:#2b3140;
    --line-2:#3a4254;
    --ink:#e6e9ef;
    --ink-2:#c3c9d4;
    --muted:#8b94a4;
    --muted-2:#6e7685;
    --accent:#e08157;
    --accent-soft:#3a2218;
    --ok:#7fb987;
    --ok-soft:#1f2f22;
    --warn:#e0b249;
    --warn-soft:#3a2f16;
    --err:#e07874;
    --err-soft:#3a1e1c;
    --stale:#666b77;
    --stale-soft:#242832;
    --focus:#86a8df;
    --focus-soft:#1e2a3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.35}
  body{padding:20px 28px 28px}

  /* ---------- page header ---------- */
  .ph{display:flex;align-items:flex-end;gap:18px;margin-bottom:14px}
  .ph .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .ph .mark{
    width:26px;height:26px;border-radius:5px;
    background:linear-gradient(135deg,var(--accent) 0%, var(--accent) 50%, var(--ink) 50%, var(--ink) 100%);
    position:relative;
  }
  .ph h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .ph .sub{color:var(--muted);font-size:12px;margin-top:1px}
  .ph .tabs{display:flex;gap:2px;flex:1;margin-left:20px;border-bottom:1px solid var(--line);min-width:0}
  .ph .tabs button{
    font:inherit;font-weight:500;font-size:13px;
    background:transparent;border:1px solid transparent;border-bottom:none;
    padding:7px 14px;cursor:pointer;color:var(--muted);
    border-radius:5px 5px 0 0;white-space:nowrap;position:relative;top:1px;
  }
  .ph .tabs button.active{background:var(--panel);border-color:var(--line);color:var(--ink)}
  .ph .tabs button:hover:not(.active){color:var(--ink);background:var(--panel-2)}
  .ph .tabs .sp{flex:1}
  .ph .tools{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
  .ph .tools kbd{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    background:var(--panel);border:1px solid var(--line);border-bottom-width:2px;
    padding:1px 5px;border-radius:3px;color:var(--ink-2)
  }

  /* ---------- application window ---------- */
  .app{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 1px 0 rgba(0,0,0,.02), 0 8px 30px rgba(20,30,50,.08);
    overflow:hidden;
  }
  .tb{
    display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);
    font-size:12px;color:var(--ink-2);
  }
  .tb .dots{display:flex;gap:6px}
  .tb .dots i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.08)}
  .tb .dots i.r{background:#ec6a5e}.tb .dots i.y{background:#f4bf4f}.tb .dots i.g{background:#61c555}
  .tb .title{flex:1;text-align:center;font-weight:500;color:var(--ink)}
  .tb .title .sep{color:var(--muted);margin:0 6px}
  .tb .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;padding:2px 6px;
    border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--muted);
    white-space:nowrap;
  }
  .mb{
    display:flex;gap:2px;padding:2px 4px;border-bottom:1px solid var(--line);
    background:var(--panel);font-size:12px;
  }
  .mb > span{padding:4px 10px;cursor:default;color:var(--ink-2);border-radius:4px}
  .mb > span:hover{background:var(--panel-2)}

  /* ---------- stage cards / signal chain ---------- */
  .chain{
    display:grid;grid-template-columns:repeat(7, 1fr);gap:8px;
    padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);
  }
  .stage{
    position:relative;padding:10px 12px;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;cursor:pointer;
    transition:border-color .12s, background .12s;
    min-height:78px;
  }
  .stage:hover{border-color:var(--line-2);background:var(--panel-3)}
  .stage.active{
    background:var(--focus-soft);border-color:var(--focus);
    box-shadow:inset 0 0 0 1px var(--focus);
  }
  .stage.warn{background:var(--warn-soft);border-color:var(--warn)}
  .stage.err{background:var(--err-soft);border-color:var(--err)}
  .stage.stale{background:var(--stale-soft);color:var(--muted)}
  .stage .h{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .stage .n{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .stage .t{font-size:14px;font-weight:600;margin-top:2px;color:var(--ink)}
  .stage.stale .t{color:var(--muted)}
  .stage .s{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;line-height:1.35}
  .stage .num{
    position:absolute;top:-7px;left:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:0 6px;font-size:9.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 2px var(--warn-soft)}
  .dot.err{background:var(--err);box-shadow:0 0 0 2px var(--err-soft)}
  .dot.stale{background:var(--stale);box-shadow:0 0 0 2px var(--stale-soft)}

  /* flow connector (arrow) between stages */
  .stage + .stage::before{
    content:"";position:absolute;left:-8px;top:50%;width:8px;height:1px;
    background:var(--line-2);
  }
  .stage .open-detail{
    position:absolute;top:6px;right:6px;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--muted);border-radius:3px;cursor:pointer;
    opacity:0;transition:opacity .12s, background .12s, color .12s;
  }
  .stage:hover .open-detail{opacity:1}
  .stage .open-detail:hover{background:var(--accent);color:#fff}

  /* ---------- KPI strip ---------- */
  .kpis{display:flex;gap:0;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
  .kpi{
    flex:0 0 auto;padding:4px 14px;border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;min-width:118px;min-height:54px;justify-content:center;
  }
  .kpi:last-of-type{border-right:none}
  .kpi .k,.kpi .v,.kpi .tr{white-space:nowrap}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
  .kpi .v{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--ink);line-height:1.15}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
  .kpi.primary .v{color:var(--accent)}
  .kpi .tr{font-size:10.5px;color:var(--ok);font-family:'IBM Plex Mono',monospace}
  .kpi .tr.down{color:var(--err)}
  .kpi.stale .v{color:var(--muted)}
  .kpi.stale .v::after{content:" →?";color:var(--warn);font-size:12px}
  .kpis .sp{flex:1}
  .kpis .runbtn{
    font:inherit;font-size:13px;font-weight:500;padding:6px 14px;
    background:var(--accent);color:#fff;border:1px solid var(--accent);
    border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .kpis .runbtn:hover{filter:brightness(1.05)}
  .kpis .runbtn.stale{background:var(--warn);border-color:var(--warn);color:#1b2230}
  .kpis .ghost{
    font:inherit;font-size:12px;padding:5px 10px;
    background:var(--panel);color:var(--ink-2);border:1px solid var(--line);
    border-radius:5px;cursor:pointer;margin-right:6px;
  }
  .kpis .ghost:hover{background:var(--panel-2)}

  /* ---------- main body grid ---------- */
  .body{display:grid}
  .body.A{grid-template-columns:280px 1fr;grid-template-rows:minmax(340px, 1fr) 260px}
  .body.D{grid-template-columns:280px 1fr 260px;grid-template-rows:minmax(320px, 1fr) 260px}

  .side, .canvas, .detail, .rail {
    padding:12px 14px;border-right:1px solid var(--line);border-top:1px solid var(--line);
    background:var(--panel);overflow:hidden;
  }
  .body.A .canvas{grid-column:2}
  .body.A .detail{grid-column:1 / -1;border-right:none}
  .body.D .canvas{grid-column:2}
  .body.D .rail{grid-column:3;border-right:none}
  .body.D .detail{grid-column:1 / -1;border-right:none}

  .panel-h{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-bottom:8px;min-width:0;
  }
  .panel-h .t{font-size:12.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .panel-h .a{font-size:11.5px;color:var(--muted);display:flex;gap:10px;white-space:nowrap;flex-shrink:0}
  .panel-h .a span:hover{color:var(--ink);cursor:pointer}

  /* search */
  .search{
    display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:4px;margin-bottom:8px;
  }
  .search input{
    flex:1;border:none;background:transparent;outline:none;font:inherit;font-size:12.5px;color:var(--ink);
  }
  .search kbd{
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    background:var(--panel);border:1px solid var(--line);padding:0 4px;border-radius:2px;color:var(--muted)
  }

  /* param tree */
  .tree{font-size:12.5px}
  .tree .grp{display:flex;align-items:center;gap:4px;padding:5px 0 4px;color:var(--ink-2);font-weight:500;cursor:default}
  .tree .grp .chev{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;width:10px}
  .tree .row{
    display:grid;grid-template-columns:1fr 72px 28px;gap:6px;align-items:center;
    padding:2px 0 2px 16px;color:var(--ink-2);
  }
  .tree .row:hover{background:var(--panel-2);border-radius:3px}
  .tree .row.sel{background:var(--focus-soft)}
  .tree .row .n{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree .row .v{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:right;
    padding:2px 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:3px;color:var(--ink);
  }
  .tree .row.derived .v{background:var(--panel-3);color:var(--muted);border-style:dashed}
  .tree .row .u{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
  .tree .row .flag{position:absolute;right:2px;font-size:9px;color:var(--warn)}
  .tree .row.tol .n::after{content:" ±σ";font-size:10px;color:var(--warn);font-family:'IBM Plex Mono',monospace}

  /* viz panels */
  .viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:calc(100% - 26px)}
  .viz{
    border:1px solid var(--line);border-radius:5px;padding:10px 12px 6px;background:var(--panel);
    display:flex;flex-direction:column;gap:6px;min-height:0;
  }
  .viz .vh{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
  .viz .vh .t{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  .viz .vh .m{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .viz .plot{flex:1;min-height:0}

  /* bottom detail tabs */
  .dtabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:10px}
  .dtabs button{
    font:inherit;font-size:12px;padding:5px 12px;background:transparent;
    border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);
    position:relative;top:1px;white-space:nowrap;
  }
  .dtabs button.active{color:var(--accent);border-color:var(--accent);font-weight:500}
  .dtabs button:hover:not(.active){color:var(--ink)}
  .dtabs .sp{flex:1}
  .dtabs .x{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 10px}

  /* noise budget rows */
  .nb{display:grid;grid-template-columns:160px 60px 1fr 48px;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;row-gap:3px;align-items:center}
  .nb .nbar{height:10px;background:var(--panel-3);border-radius:2px;overflow:hidden;position:relative}
  .nb .nbar i{display:block;height:100%;background:var(--accent)}
  .nb .nbar.sec i{background:var(--focus)}
  .nb .total{font-weight:600;color:var(--ink)}
  .nb .muted{color:var(--muted)}
  .nb .pct{text-align:right;color:var(--muted)}

  /* status bar */
  .sb{
    display:flex;align-items:center;gap:14px;padding:6px 14px;
    border-top:1px solid var(--line);background:var(--panel-2);
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;
  }
  .sb > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
  .sb .ok{color:var(--ok)}.sb .warn{color:var(--warn)}.sb .err{color:var(--err)}
  .sb .sp{flex:1}

  /* right rail (D only) */
  .actions{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
  .action{
    display:flex;align-items:center;gap:8px;padding:7px 10px;
    border:1px solid var(--line);border-radius:4px;background:var(--panel-2);cursor:pointer;font-size:12.5px;
  }
  .action:hover{background:var(--panel-3);border-color:var(--line-2)}
  .action .k{flex:1}
  .action .s{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted)}
  .action.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .action.primary .s{color:rgba(255,255,255,.7)}
  .action.primary:hover{filter:brightness(1.05);background:var(--accent)}
  .recents{font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.8;color:var(--ink-2)}
  .recents div{padding:2px 6px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recents div:hover{background:var(--panel-2)}
  .recents .cur{color:var(--accent);font-weight:500}
  .rail h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:14px 0 6px;border-top:1px solid var(--line);padding-top:10px}
  .rail h4:first-child{border-top:none;margin-top:0;padding-top:0}
  .tag-row{display:flex;gap:4px;flex-wrap:wrap}
  .tag{
    font-size:11px;padding:2px 7px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);
  }
  .tag.accent{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  /* ---------- signal chain drill-down (below detail tabs) ---------- */
  .drill{
    border-top:1px solid var(--line);background:var(--panel-2);
    padding:14px 16px;
  }
  .drill-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:10px}
  .drill-h .t{font-size:13px;font-weight:600;color:var(--ink)}
  .drill-h .sub{font-size:11.5px;color:var(--muted)}
  .drill-grid{
    display:grid;grid-template-columns:repeat(7, minmax(0,1fr));gap:10px;
  }
  .dcard{
    background:var(--panel);border:1px solid var(--line);border-radius:5px;
    padding:10px 11px;display:flex;flex-direction:column;gap:7px;font-size:11.5px;
  }
  .dcard.active{border-color:var(--focus);background:var(--focus-soft)}
  .dcard .dh{display:flex;align-items:center;justify-content:space-between}
  .dcard .dh .t{font-size:12.5px;font-weight:600;color:var(--ink)}
  .dcard .sec{display:flex;flex-direction:column;gap:2px}
  .dcard .sec .lbl{
    font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);font-weight:500;
  }
  .dcard .sec .li{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .dcard .sec .li.warn{color:var(--warn)}
  .dcard .sec .li.ok{color:var(--ok)}

  /* ---------- tweaks panel ---------- */
  .tweaks{
    position:fixed;right:22px;bottom:22px;z-index:100;
    background:var(--panel);border:1px solid var(--line-2);border-radius:6px;
    padding:12px 14px;box-shadow:0 8px 30px rgba(20,30,50,.15);
    font-size:12.5px;max-width:240px;display:none;
  }
  .tweaks.show{display:block}
  .tweaks h3{margin:0 0 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .tweaks .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}
  .tweaks label{color:var(--ink-2)}
  .tweaks select,.tweaks button{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:3px;cursor:pointer}

  /* overlays */
  .overlay{
    position:absolute;inset:0;background:rgba(235,238,242,.75);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:5;
  }
  body.dark .overlay{background:rgba(15,18,22,.75)}
  .overlay .ob{
    background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:18px 22px;
    box-shadow:0 8px 40px rgba(20,30,50,.2);max-width:480px;
  }
  .overlay .ob h3{margin:0 0 6px;font-size:14px}
  .overlay .ob ul{font-family:'IBM Plex Mono',monospace;font-size:11.5px;margin:8px 0;padding-left:18px;line-height:1.55;color:var(--ink-2)}
  .overlay .ob ul b{color:var(--err)}

  /* hide scrollbars visually but keep scroll */
  .tree,.detail,.drill{scrollbar-width:thin}

  /* prevent page scroll */
  body{overflow-x:hidden}
</style>
</head>
<body>

<div class="ph">
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>RADIANT</h1>
      <div class="sub">Mid-fi · Qt6 PySide6 mock</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="active" title="You are here — visual signal-chain workspace"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px;vertical-align:-2px;margin-right:6px"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>Workspace</button>
    <button onclick="location.href='RADIANT Scripting.html'" title="Open the Python scripting workspace"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:13px;height:13px;vertical-align:-2px;margin-right:6px"><path d="M2 4 L5 7 L2 10"/><line x1="6" y1="11" x2="13" y2="11"/></svg>Scripting</button>
    <div class="sp"></div>
  </div>
  <div class="tools">
    <span>Layout</span><kbd>A</kbd><kbd>D</kbd>
  </div>
</div>

<div id="root"></div>

<div class="tweaks" id="tweaks">
  <h3>Tweaks</h3>
  <div class="row"><label>Layout</label>
    <select id="tw-layout"><option value="A">A · Horizontal Flow</option><option value="D">D · Split Canvas</option></select>
  </div>
  <div class="row"><label>State</label>
    <select id="tw-state">
      <option value="loaded">Loaded · evaluated</option>
      <option value="stale">Stale · params edited</option>
      <option value="evaluating">Evaluating…</option>
      <option value="error">Validation error</option>
      <option value="empty">Empty · no YAML</option>
    </select>
  </div>

          <div class="viz-grid">
            <div class="viz">
              <div class="vh"><span class="t">System MTF</span><span class="m">ν_nyq = 27.8 cyc/mrad</span></div>
              <div class="plot">${plotMTF()}</div>
            </div>
            <div class="viz">
              <div class="vh"><span class="t">Spectral radiance</span><span class="m">500 λ pts · 3–5 µm</span></div>
              <div class="plot">${plotSpectral()}</div>
            </div>
          </div>
        </div>
        <div class="detail">${detailPane()}</div>
      </div>
      ${drillDown(focus, showDrill)}
      ${statusBar(st)}
      ${overlayForState(st)}
    </div>`;
}

function layoutD(st, focus, showDrill){
  return `
    <div class="app" style="position:relative">
      ${titleBar()}
      ${chainStrip(st, focus)}
      ${kpiStrip(st)}
      <div class="body D">
        <div class="side">${sideParams(focus)}</div>
        <div class="canvas">
          <div class="panel-h"><span class="t">Visualization · ${STAGES.find(s=>s.k===focus).name}</span><span class="a"><span>reset view</span><span>export PNG</span></span></div>
          <div class="viz-grid">
            <div class="viz">
              <div class="vh"><span class="t">System MTF</span><span class="m">ν_nyq = 27.8 cyc/mrad</span></div>
              <div class="plot">${plotMTF()}</div>
            </div>
            <div class="viz">
              <div class="vh"><span class="t">Spectral radiance</span><span class="m">500 λ pts · 3–5 µm</span></div>
              <div class="plot">${plotSpectral()}</div>
            </div>
          </div>
        </div>
        <div class="rail">${rightRail()}</div>
        <div class="detail">${detailPane()}</div>
      </div>
      ${drillDown(focus, showDrill)}
      ${statusBar(st)}
      ${overlayForState(st)}
    </div>`;
}

const layouts = {A:layoutA, D:layoutD};

// ============================================================
// State + mount
// ============================================================
const state = {...TWEAK_DEFAULTS};
try{
  const saved = localStorage.getItem(LS_KEY);
  if(saved){ Object.assign(state, JSON.parse(saved)); }
}catch(_){}

function render(){
  document.body.classList.toggle("dark", state.theme==="dark");
  const root = document.getElementById("root");
  const L = layouts[state.layout] || layouts.A;
  root.innerHTML = L(state.state, state.focus, state.drilldown);
  // tab highlighting (no-op now — top tabs are Workspace/Scripting links)
  document.querySelectorAll("#tabs button").forEach(b=>{
    if(b.dataset.tab) b.classList.toggle("active", b.dataset.tab===state.layout);
  });
  // wire stage clicks
  root.querySelectorAll(".stage[data-k], .dcard[data-k]").forEach(el=>{
    el.addEventListener("click", (e)=>{
      // open-detail glyph navigates to stage detail
      if(e.target && e.target.classList.contains('open-detail')){
        e.stopPropagation();
        const k = e.target.dataset.open;
        if(k==='source') location.href = 'RADIANT Source Stage.html';
        else location.href = 'RADIANT Stage Screens.html#' + k;
        return;
      }
      state.focus = el.dataset.k;
      postEdit({focus:state.focus});
      render();
    });
    el.addEventListener("dblclick", ()=>{
      const k = el.dataset.k;
      if(k==='source') location.href = 'RADIANT Source Stage.html';
      else location.href = 'RADIANT Stage Screens.html#' + k;
    });
  });
  // sync tweaks
  const setSel = (id, v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
  setSel("tw-layout", state.layout);
  setSel("tw-state", state.state);
  setSel("tw-theme", state.theme);
  setSel("tw-drill", state.drilldown);
  setSel("tw-focus", state.focus);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(_){}
}

document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b || !b.dataset.tab) return;
  state.layout = b.dataset.tab;
  postEdit({layout:state.layout});
  render();
});

window.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")) return;
  const k = e.key.toUpperCase();
  if(k==="A"||k==="D"){ state.layout=k; postEdit({layout:k}); render(); }
});

function postEdit(edits){
  try{ window.parent.postMessage({type:'__edit_mode_set_keys', edits}, '*'); }catch(_){}
}
window.addEventListener("message", e=>{
  const d=e.data||{};
  if(d.type==="__activate_edit_mode")   document.getElementById("tweaks").classList.add("show");
  if(d.type==="__deactivate_edit_mode") document.getElementById("tweaks").classList.remove("show");
});
window.parent.postMessage({type:'__edit_mode_available'}, '*');

["layout","state","theme","drill","focus"].forEach(k=>{
  const el = document.getElementById("tw-"+k);
  if(!el) return;
  el.addEventListener("change", ()=>{
    const map={layout:"layout",state:"state",theme:"theme",drill:"drilldown",focus:"focus"};
    state[map[k]] = el.value;
    postEdit({[map[k]]:el.value});
    render();
  });
});

render();
</script>
</body>
</html>
