# Shared Pandoc defaults for every volume of the RADIANT manual suite.
#
# One template, four volumes (Support_Documentation_Plan §3): anything that differs
# per volume (title, subtitle, cover date/version, running head) is supplied by
# scripts/build_manual.py at build time via --metadata-file and a generated
# --include-in-header snippet. Nothing here is volume-specific, and there is no
# per-volume fork of this file (Rule 27).
#
# Invoked as: pandoc --defaults scripts/manual_assets/manual.yaml ...
# Everything path-valued (include-in-header, the chapter list, -o) is passed on the
# command line as an absolute path, so this file stays location-independent.

# Equation treatment: $...$ / $$...$$ (OPERATING_MODEL §5.4). pandoc-crossref is
# deliberately NOT used — per-equation numbering is not worth a toolchain dependency
# (Support_Documentation_Plan §8).
#
# raw_attribute admits fenced ```{=latex} blocks and nothing else — it is what lets the
# builder stage its generated \appendix marker between the last chapter and the first
# appendix. Ordinary prose, including a fenced block with any other (or no) language
# tag, converts exactly as before; this is not a raw-HTML door (§5.4 rule 2 stands, and
# the builder's own scan still fails a chapter carrying raw HTML).
from: gfm+tex_math_dollars+raw_attribute

standalone: true
toc: true
toc-depth: 2
number-sections: true

# Each chapter file's H1 becomes a LaTeX \chapter. Stated explicitly rather than left
# to pandoc's documentclass-dependent default.
top-level-division: chapter

pdf-engine: xelatex

variables:
  # `report` gives a full-page cover from \maketitle (ruling Q6: title, subtitle,
  # version + git describe, build date, author — nothing else) and numbered chapters.
  documentclass: report
  classoption:
    - oneside
  papersize: letter
  fontsize: 11pt
  geometry:
    - margin=1in
  linestretch: 1.05

  # Under XeTeX, load mathspec instead of unicode-math (the template default).
  # unicode-math makes prose Unicode symbols (′ ″ ↔ ∈ …) math-active, which
  # breaks the manual_header.tex newunicodechar mappings with "Missing $" errors
  # (first real PDF build, 2026-09-17); mathspec leaves text catcodes alone and
  # classic Latin Modern math stands in for the few real formulas.
  mathspec: true

  # Cross-platform faces (Rule 30). All three ship with TeX Live / MiKTeX on both
  # macOS and Windows and cover the µ / ° / ² / λ characters these chapters use.
  # The previous Helvetica Neue / Menlo pinning was macOS-only (Findings_Log
  # 2026-09-16); do not reintroduce platform-local faces here.
  #
  # Loaded by FILENAME (kpathsea lookup inside the TeX tree), not by family name:
  # on macOS XeTeX resolves family names through CoreText, which cannot see
  # texmf-dist fonts, so "TeX Gyre Termes" fails on a stock MacTeX even though the
  # .otf files are installed (first real PDF build, 2026-09-17). Filename lookup
  # works identically on TeX Live (macOS/Linux) and MiKTeX (Windows).
  mainfont: texgyretermes
  mainfontoptions:
    - Extension=.otf
    - UprightFont=*-regular
    - BoldFont=*-bold
    - ItalicFont=*-italic
    - BoldItalicFont=*-bolditalic
  sansfont: texgyreheros
  sansfontoptions:
    - Extension=.otf
    - UprightFont=*-regular
    - BoldFont=*-bold
    - ItalicFont=*-italic
    - BoldItalicFont=*-bolditalic
  monofont: DejaVuSansMono
  monofontoptions:
    - Extension=.ttf
    - BoldFont=*-Bold
    - ItalicFont=*-Oblique
    - BoldItalicFont=*-BoldOblique
    - Scale=0.85

  # Hyperlinked TOC and cross-references, printable colours.
  colorlinks: true
  linkcolor: MidnightBlue
  urlcolor: MidnightBlue
  citecolor: MidnightBlue
  toccolor: black

  # Number down to subsubsection; the TOC still stops at depth 2.
  secnumdepth: 3
