notes: >
  QE and read noise are ASSUMED (flagged above) - the datasheet is qualitative
  on both ('low readout noise, low dark current, high quantum efficiency');
  dark current and ADC bit depth are not published and deliberately not set.
  The NETD spec (<28 mK at 70 % fill of 2.5 Me-) is a temperature-domain
  anchor: validate any RADIANT NEDT prediction for this part against it (f/#
  unstated on the sheet; SCD's standard cold shield is f/3-class - confirm
  before comparing). Spectral band 1-5.4 um is the InSb response; the standard
  cold filter restricts in-band flux (3.6-4.9 um typical for SCD MWIR;
  options exist) - set the study bandpass to the actual filter. Web sources
  also cite a 2 Me- well configuration. Cooler: 18 W rotary integral / split;
  binning and windowing supported.
