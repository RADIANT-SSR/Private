# Typography source-of-truth for every user-facing concept label.
#
# Per T1 of the visual remediation: every label rendered in the viewport
# (VTK math-text) and every label rendered in a Qt panel (HTML <sub>)
# resolves through scene/labels/typography.py against this file. Adding
# a new concept symbol without an entry here is a typography-sweep
# regression and the T10 grep test will catch it.
#
# Schema per entry (all three forms required):
#   latex:       VTK math-text form ("$...$") for in-viewport labels.
#   html:        HTML form (with <sub>/<i>) for Qt panels.
#   description: Human-readable glossary text for tooltips, help overlay.

surface_normal_background:
  latex: "$n_{B}$"
  html: "n<sub>B</sub>"
  description: "Surface normal at the background point B"
sun_vector_target:
  latex: "$s_{t}$"
  html: "s<sub>t</sub>"
  description: "Unit vector from target to sun"
sun_vector_background:
  latex: "$s_{B}$"
  html: "s<sub>B</sub>"
  description: "Unit vector from background point to sun"
boresight:
  latex: "$o$"
  html: "<i>o</i>"
  description: "Sensor boresight (look direction)"
off_nadir_angle:
  latex: "$\\theta_{off}$"
  html: "θ<sub>off</sub>"
  description: "Off-nadir angle (sensor look angle from nadir)"
solar_zenith_target:
  latex: "$\\theta_{s}$"
  html: "θ<sub>s</sub>"
  description: "Solar zenith angle at the target"
solar_zenith_background:
  latex: "$\\theta_{sun,B}$"
  html: "θ<sub>sun,B</sub>"
  description: "Solar zenith angle at the background point"
phase_angle_target:
  latex: "$\\alpha_{t}$"
  html: "α<sub>t</sub>"
  description: "Phase angle at the target (sun-target-observer)"
relative_azimuth:
  latex: "$\\Delta\\varphi$"
  html: "Δφ"
  description: "Relative azimuth between sun and observer"
projected_area:
  latex: "$A_{t}$"
  html: "A<sub>t</sub>"
  description: "Projected target area used by the radiometry"
azimuth:
  latex: "$az$"
  html: "az"
  description: "Azimuth angle"
elevation:
  latex: "$el$"
  html: "el"
  description: "Elevation angle"
axis_x:
  latex: "$x$"
  html: "x"
  description: "X axis"
axis_y:
  latex: "$y$"
  html: "y"
  description: "Y axis"
axis_z:
  latex: "$z$"
  html: "z"
  description: "Z axis"
