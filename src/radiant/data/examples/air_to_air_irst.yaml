# RADIANT config — written by Sensor.to_yaml()
_radiant:
  example:
    name: Air-to-Air IRST
    blurb: 'Two aircraft co-altitude at 10 km, head-on: a point-source detection-range
      problem through a level atmospheric path.'
    specs: MWIR 3.5–5 µm · 15 cm aperture · 10 km vs 10 km · point source
    tune_next:
    - source.target.range_m
    - detector.read_noise_e_rms
    - spectral_integration.integration_time_s
    provenance: adapted from scenarios/10_direction_general/10.2 (2026-09-08)
  format: 1
  wavelength_points: 500
atmosphere:
  aerosol_type: rural
  model: simple
  precipitable_water_cm: 2.92
  standard_atmosphere: midlat_summer
  visibility_km: 23.0
detector:
  dark_rate_e_per_s: 50000.0
  detector_temperature_K: 80.0
  fill_factor: 1.0
  pixel_pitch_x_um: 20.0
  pixel_pitch_y_um: 20.0
  qe_value: 0.8
geometry:
  ground_speed_m_s: 246.93312
  sensor_altitude_m: 10000.0
  solar_illumination: night
  target_altitude_m: 10000.0
  target_range_m: 50000.0
optics:
  aperture_diameter_m: 0.15
  focal_length_m: 0.45
  obscuration_ratio: 0.0
  # Warm-optics self-emission is modelled from a declared train (CU-380).
  # Two reflective surfaces at R = sqrt(0.75) = 0.866025 reproduce the net
  # throughput this file previously declared as `transmission_scalar: 0.75`,
  # so the SCENE signal is unchanged; what is new is that each mirror now
  # EMITS, since Kirchhoff gives a mirror eps = 1 - R = 0.133975.
  #
  # temperature_K below is a STARTING POINT for this platform class
  # (airborne (10 km) — uncooled instrument near ambient), not a claim about any specific
  # instrument. Set it to your optics' actual temperature — in a thermal
  # band it is usually the dominant background, so it is the single most
  # important number in this file after the aperture.
  wfe_rms_waves: 0.05
performance:
  detection_snr_threshold: 5.0
readout:
  adc_bits: 14
  full_well_capacity_e: 1000000.0
  gain_e_per_dn: 61.0
  read_noise_e_rms: 40.0
source:
  scene_type: point_source
  target:
    point_intensity_area_m2: 0.36
    point_intensity_emissivity: 0.9
    point_intensity_temperature_K: 500.0
spectral_integration:
  filter_max_um: 5.0
  filter_min_um: 3.5
  integration_time_s: 0.0001

optical_elements:
  - {name: M1, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.866025, temperature_K: 290.0}
  - {name: M2, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.866025, temperature_K: 290.0}
