# RADIANT config — written by Sensor.to_yaml()
_radiant:
  example:
    name: Airborne Hotspot Detection
    blurb: A 10 km airborne sensor with a 600 K hotspot on a 300 K background — the
      MWIR arm of the dual-band trade, where clutter, not photons, decides the band.
    specs: MWIR 3.5–5 µm · 2.5 cm aperture · 10 km airborne · sub-pixel 600 K target
    tune_next:
    - source.target.temperature
    - source.background.temperature
    - detector.pixel_pitch_x_um
    provenance: adapted from scenarios/01_sarah_systems_engineer/1.3 (2026-09-08)
  format: 1
  wavelength_points: 500
atmosphere:
  model: simple
  standard_atmosphere: midlat_summer
detector:
  clutter_sigma: 0.03
  dark_rate_e_per_s: 80000.0
  detector_temperature_K: 80.0
  pixel_pitch_x_um: 20.0
  pixel_pitch_y_um: 20.0
  qe_value: 0.78
geometry:
  path_zenith_rad: 0.0
  sensor_altitude_m: 10000.0
  target:
    projected_area_m2: 5.0
  target_range_m: 10000.0
optics:
  aperture_diameter_m: 0.025
  focal_length_m: 0.05
  # Warm-optics self-emission is modelled from a declared train (CU-380).
  # Two reflective surfaces at R = sqrt(0.78) = 0.883176 reproduce the net
  # throughput this file previously declared as `transmission_scalar: 0.78`,
  # so the SCENE signal is unchanged; what is new is that each mirror now
  # EMITS, since Kirchhoff gives a mirror eps = 1 - R = 0.116824.
  #
  # temperature_K below is a STARTING POINT for this platform class
  # (airborne (10 km) — uncooled instrument near ambient), not a claim about any specific
  # instrument. Set it to your optics' actual temperature — in a thermal
  # band it is usually the dominant background, so it is the single most
  # important number in this file after the aperture.
readout:
  adc_bits: 14
  full_well_capacity_e: 4000000.0
  gain_e_per_dn: 260.0
  read_noise_e_rms: 25.0
source:
  background:
    emissivity: 0.953
    temperature: 300.0
  regime_override: sub_pixel
  scene_type: sub_pixel
  target:
    emissivity: 0.85
    fill_fraction: 0.31250000000000006
    temperature: 600.0
spectral_integration:
  filter_max_um: 5.0
  filter_min_um: 3.5
  integration_time_s: 5.0e-06

optical_elements:
  - {name: M1, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.883176, temperature_K: 290.0}
  - {name: M2, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.883176, temperature_K: 290.0}
