[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant"
version = "0.1.0"
description = "First-principles EO sensor performance modeling framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
    "import-linter>=2.0",
    "hypothesis>=6.90",
    "h5py>=3.10",
]
# Scenario run scripts read/write vendor-format Excel workbooks (CU-057).
scenarios = [
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
radiant = "radiant.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "--strict-markers"
markers = [
    "level0: Physics correctness tests (analytic result checks)",
    "level1: Module-level tests",
    "level2: End-to-end reference scenario tests",
    "golden: Golden regression tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM"]
ignore = []

[tool.importlinter]
root_package = "radiant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core has no radiant imports"
type = "forbidden"
source_modules = ["radiant.core"]
forbidden_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
    "radiant.data",
]
ignore_imports = [
    # Test-colocation: the reflectance descriptor lives in core but its
    # canonical test fixtures (Lambertian, Phong) live in source. Tests
    # may reach across this seam.
    "radiant.core.tests.test_reflectance_descriptor -> radiant.source.brdf_lambertian",
    "radiant.core.tests.test_reflectance_descriptor -> radiant.source.brdf_phong",
]

[[tool.importlinter.contracts]]
name = "physics stages import only core"
type = "forbidden"
source_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
forbidden_modules = [
    "radiant.io",
    "radiant.api",
    "radiant.cli",
]
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    # Test-colocation: physics-stage tests use api utilities (param
    # registry helpers, full-chain session fixtures, schema cross-checks).
    # Production stage code is not allowed to import api/io — these
    # exceptions cover the test seam only.
    "radiant.*.tests.* -> radiant.api._param_registry",
    "radiant.*.tests.* -> radiant.api.session",
    "radiant.*.tests.* -> radiant.api.sensor",
    "radiant.*.tests.* -> radiant.io.results",
    "radiant.*.tests.* -> radiant.io.config",
]

[[tool.importlinter.contracts]]
name = "no cross-stage physics imports"
type = "independence"
modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    # Test-colocation: physics-stage tests use cross-stage `_schema`
    # modules (parameter definitions) and api utilities to assemble
    # realistic full-chain fixtures. Production stage code remains
    # cross-stage independent — these exceptions cover the test seam only.
    "radiant.*.tests.* -> radiant.api._param_registry",
    "radiant.*.tests.* -> radiant.api.session",
    "radiant.*.tests.* -> radiant.source._schema",
    "radiant.*.tests.* -> radiant.atmosphere._schema",
    "radiant.*.tests.* -> radiant.optics._schema",
    "radiant.*.tests.* -> radiant.platform._schema",
    "radiant.*.tests.* -> radiant.spectral_integration._schema",
    "radiant.*.tests.* -> radiant.detector._schema",
    "radiant.*.tests.* -> radiant.readout._schema",
    "radiant.*.tests.* -> radiant.optics.psf.builder",
    "radiant.*.tests.* -> radiant.optics.psf.effective",
    "radiant.*.tests.* -> radiant.optics.psf_mono",
    "radiant.*.tests.* -> radiant.optics.sampling",
    "radiant.*.tests.* -> radiant.detector.noise.budget",
    "radiant.*.tests.* -> radiant.atmosphere.exo",
    "radiant.*.tests.* -> radiant.atmosphere.assembly",
]

[[tool.importlinter.contracts]]
name = "cli imports only api and io"
type = "forbidden"
source_modules = ["radiant.cli"]
forbidden_modules = [
    "radiant.core",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
ignore_imports = [
    # Transitive imports through api/ and io/ are allowed — the contract
    # enforces that cli modules do not *directly* import physics stages.
    "radiant.api.session -> radiant.core.chain",
    "radiant.api.session -> radiant.core.parameters",
    "radiant.api.session -> radiant.source.stage",
    "radiant.api.session -> radiant.atmosphere.stage",
    "radiant.api.session -> radiant.atmosphere.loaders",
    "radiant.api.session -> radiant.optics.stage",
    "radiant.api.session -> radiant.spectral_integration.stage",
    "radiant.api.session -> radiant.detector.stage",
    "radiant.api.session -> radiant.readout.stage",
    "radiant.api.session -> radiant.performance.stage",
    "radiant.api._param_registry -> radiant.source._schema",
    "radiant.api._param_registry -> radiant.atmosphere._schema",
    "radiant.api._param_registry -> radiant.optics._schema",
    "radiant.api._param_registry -> radiant.spectral_integration._schema",
    "radiant.api._param_registry -> radiant.detector._schema",
    "radiant.api._param_registry -> radiant.readout._schema",
    "radiant.api._param_registry -> radiant.core.parameters",
    "radiant.io.config -> radiant.core.parameters",
    "radiant.io.config -> radiant.core.exceptions",
    "radiant.io.config -> radiant.core.provenance",
    "radiant.io.results -> radiant.core.chain",
    "radiant.io.results -> radiant.core.parameters",
    "radiant.io.results -> radiant.core.provenance",
    "radiant.io.results -> radiant.core.radiometry",
    "radiant.io.results -> radiant.core.quantity",
    # `to_provenance_record` reads `radiant.__version__` lazily; the
    # `radiant` package init re-exports `RadiantError` from
    # `radiant.core.exceptions`, so the `radiant -> radiant.core.exceptions`
    # edge gets attributed to any cli-reachable module that touches the
    # provenance code path.
    "radiant.io.results -> radiant",
    "radiant -> radiant.core.exceptions",
    "radiant.api.units -> radiant.core.units",
    "radiant.api.sensor -> radiant.core.parameters",
    "radiant.api.sensor -> radiant.api.tolerance",
    "radiant.api.tolerance -> radiant.core.parameters",
    "radiant.api.sensor -> radiant.api.sensitivity",
    "radiant.api.sensitivity -> radiant.core.parameters",
    "radiant.api.sweep -> radiant.core.parameters",
    "radiant.api.solve -> radiant.core.exceptions",
    "radiant.api.solve -> radiant.core.parameters",
    "radiant.api.compare -> radiant.core.exceptions",
    "radiant.api.compare -> radiant.performance.frequency_units",
    "radiant.api.compare -> radiant.io.measurement",
    "radiant.api.plot -> radiant.api.sweep",
    "radiant.api.plot -> radiant.optics.psf.effective",
    "radiant.api._param_registry -> radiant.platform._schema",
    "radiant.api.session -> radiant.platform.stage",
    "radiant.platform.stage -> radiant.core.chain",
    "radiant.platform.stage -> radiant.core.parameters",
    "radiant.platform.stage -> radiant.core.geometry",
    "radiant.platform._schema -> radiant.core.parameters",
]

[[tool.importlinter.contracts]]
name = "data imports only core"
type = "forbidden"
source_modules = ["radiant.data"]
forbidden_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
]
ignore_imports = [
    # Test-colocation: template smoke tests evaluate full sensors through
    # the public API. Production radiant.data code imports core only.
    "radiant.data.tests.test_templates -> radiant.api",
]
