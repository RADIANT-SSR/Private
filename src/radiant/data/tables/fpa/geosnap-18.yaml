fpa_preset: 1
name: geosnap-18
vendor: Teledyne Imaging Sensors / Teledyne Space Imaging
model: GeoSnap-18
part_class: cooled_ir
material: HgCdTe (customer-specified cutoff; Si PIN HyViSI for visible)
band: {label: "custom-cutoff HgCdTe (VNIR-VLWIR)", cut_on_um: 0.4, cut_off_um: 15.0}
description: >
  2048x2048, 18 um pitch digital-interface FPA: CTIA unit cell with two
  programmable gains and on-chip 14-bit ADC (analog well + column conversion,
  NOT in-pixel counting). TRL 9; >12 space missions as of 2022. Values below
  are the vendor's 2K x 2K example configuration.

parameters:
  detector.pixel_pitch_x_um:
    {value: 18.0, unit: um, source: ds2022, basis: datasheet, location: "spec table, 'Pixel Pitch 18 um'"}
  detector.pixel_pitch_y_um:
    {value: 18.0, unit: um, source: ds2022, basis: datasheet, location: "spec table (square pixel)"}
  detector.n_pixels_cross:
    {value: 2048, unit: null, source: ds2022, basis: datasheet, location: "'Example shown for 2K x 2K'"}
  detector.fill_factor:
    {value: 100, unit: "%", source: ds2022, basis: datasheet, location: "spec table, 'Pixel Fill Factor 100 %'"}
  detector.qe_value:
    {value: 85, unit: "%", source: ds2022, basis: datasheet, location: "'Quantum Efficiency 75 minimum, 85 typical %' (typical taken)"}
  detector.detector_temperature_K:
    {value: 110.0, unit: K, source: ds2022, basis: derived, location: "midpoint of the 80-140 K typical band inside the 45-300 K operating range (note 4: optimum varies with cutoff)"}
  readout.architecture:
    {value: analog_well, unit: null, source: ds2022, basis: derived, location: "CTIA unit cell + on-chip programmable 14-bit ADC = analog charge well with column conversion; no in-pixel counter"}
  readout.full_well_capacity_e:
    {value: 2.6e+6, unit: null, source: ds2022, basis: datasheet, location: "'Well Sizes 0.18 / 2.6 typical Me-' (large well taken; dual-gain, programmable per row)"}
  readout.read_noise_e_rms:
    {value: 400.0, unit: "e-", source: ds2022, basis: datasheet, location: "'ROIC Noise 40 / 400 typical e-' (large-well value; ROIC-only, see notes)"}
  readout.gain_e_per_dn:
    {value: 158.69, unit: "e-/DN", source: ds2022, basis: derived, location: "full-scale-matched default: 2.6e+6 e- well / 2^14 ADC bits = 158.69 e-/DN; the on-chip ADC is programmable and no e-/DN is published - override with the programme's actual setting"}
  readout.adc_bits:
    {value: 14, unit: null, source: ds2022, basis: datasheet, location: "'ADC Resolution 14 (maximum, programmable) bits'"}
  readout.frame_period_s:
    {value: 1.1765e-2, unit: s, source: ds2022, basis: derived, location: "1 / (85 Hz full frame rate, note 3: 80 MHz clock)"}

qe_table: null

