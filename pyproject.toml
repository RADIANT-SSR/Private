[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiant"
version = "0.1.0"
description = "First-principles EO sensor performance modeling framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "ruff>=0.1",
    "import-linter>=2.0",
    "hypothesis>=6.90",
    "h5py>=3.10",
]

[project.scripts]
radiant = "radiant.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
markers = [
    "level0: Physics correctness tests (analytic result checks)",
    "level1: Module-level tests",
    "level2: End-to-end reference scenario tests",
    "golden: Golden regression tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RET", "SIM"]
ignore = []

[tool.importlinter]
root_package = "radiant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core has no radiant imports"
type = "forbidden"
source_modules = ["radiant.core"]
forbidden_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
    "radiant.plugins",
]

[[tool.importlinter.contracts]]
name = "physics stages import only core"
type = "forbidden"
source_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
forbidden_modules = [
    "radiant.io",
    "radiant.api",
    "radiant.cli",
]
ignore_imports = [
    "radiant.optics.tests.test_stage -> radiant.api._param_registry",
    "radiant.source.tests.test_stage -> radiant.api._param_registry",
]

[[tool.importlinter.contracts]]
name = "no cross-stage physics imports"
type = "independence"
modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
ignore_imports = [
    "radiant.optics.tests.test_stage -> radiant.detector._schema",
    "radiant.optics.tests.test_stage -> radiant.api._param_registry",
    "radiant.spectral_integration.tests.test_stage -> radiant.detector._schema",
    "radiant.detector.tests.test_stage -> radiant.spectral_integration._schema",
    "radiant.source.tests.test_stage -> radiant.api._param_registry",
    "radiant.source.tests.test_stage -> radiant.optics._schema",
    "radiant.source.tests.test_stage -> radiant.detector._schema",
]

[[tool.importlinter.contracts]]
name = "cli imports only api and io"
type = "forbidden"
source_modules = ["radiant.cli"]
forbidden_modules = [
    "radiant.core",
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
]
ignore_imports = [
    # Transitive imports through api/ and io/ are allowed — the contract
    # enforces that cli modules do not *directly* import physics stages.
    "radiant.api.session -> radiant.core.chain",
    "radiant.api.session -> radiant.core.parameters",
    "radiant.api.session -> radiant.source.stage",
    "radiant.api.session -> radiant.atmosphere.stage",
    "radiant.api.session -> radiant.optics.stage",
    "radiant.api.session -> radiant.spectral_integration.stage",
    "radiant.api.session -> radiant.detector.stage",
    "radiant.api.session -> radiant.readout.stage",
    "radiant.api.session -> radiant.performance.stage",
    "radiant.api._param_registry -> radiant.source._schema",
    "radiant.api._param_registry -> radiant.atmosphere._schema",
    "radiant.api._param_registry -> radiant.optics._schema",
    "radiant.api._param_registry -> radiant.spectral_integration._schema",
    "radiant.api._param_registry -> radiant.detector._schema",
    "radiant.api._param_registry -> radiant.readout._schema",
    "radiant.api._param_registry -> radiant.core.parameters",
    "radiant.io.config -> radiant.core.parameters",
    "radiant.io.results -> radiant.core.chain",
    "radiant.io.results -> radiant.core.radiometry",
]

[[tool.importlinter.contracts]]
name = "plugins import only core"
type = "forbidden"
source_modules = ["radiant.plugins"]
forbidden_modules = [
    "radiant.source",
    "radiant.atmosphere",
    "radiant.optics",
    "radiant.platform",
    "radiant.spectral_integration",
    "radiant.detector",
    "radiant.readout",
    "radiant.performance",
    "radiant.io",
    "radiant.api",
    "radiant.cli",
]
