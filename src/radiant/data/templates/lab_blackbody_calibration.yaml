# RADIANT mission template — Lab Blackbody Calibration
# Karen's bench: the sensor stares at an extended calibration blackbody across
# a short horizontal lab path (negligible atmosphere at 5 m), predicting NEDT
# for comparison against measurement. 350 K cavity blackbody (ε 0.99), the
# same reference MWIR chain as the flight templates so lab-vs-flight deltas
# isolate the scene, not the instrument.
_radiant:
  format: 1
  template:
    name: "Lab Blackbody Calibration"
    blurb: "Bench NEDT prediction: extended cavity blackbody across a 5 m lab path."
    specs: "MWIR 3.5–5 µm · 5 m horizontal path · extended blackbody"
    tune_next:
      - source.target.temperature
      - detector.detector_temperature_K
      - spectral_integration.integration_time_s
      - readout.read_noise_e_rms
      - detector.qe_value
atmosphere:
  model: simple
  standard_atmosphere: midlat_summer
detector:
  dark_rate_e_per_s: 100.0
  detector_temperature_K: 80.0
  pixel_pitch_x_um: 18.0
  pixel_pitch_y_um: 18.0
  qe_value: 0.70
geometry:
  sensor_altitude_m: 100.0   # m — a bench above MSL keeps the level-path chord clean
  target_altitude_m: 100.0
  target_range_m: 5.0
optics:
  aperture_diameter_m: 0.30
  focal_length_m: 1.20
  transmission_scalar: 0.70
  # Warm-optics self-emission is OFF and that is a deliberate, temporary
  # statement, not a model claim (CU-380). Scalar transmission cannot carry the
  # term — a synthesized lump has no Kirchhoff emissivity — so the value here is
  # zero either way; this line makes the omission explicit instead of silent.
  #
  # For a thermal band the warm optics is usually the DOMINANT background, so
  # this is understated, not merely incomplete: declaring the same net tau as a
  # warm mirror train on RADIANT's MWIR example adds 37 % of signal in
  # background and drops SNR 17 %, and in a background-dominated point-source
  # case the same mechanism measured 19x. Before trusting a thermal-band SNR
  # from this file, replace `transmission_scalar` with an `optical_elements:`
  # train carrying each surface's `temperature_K`.
  #
  # Choosing those temperatures is an instrument-specific judgement, so it is
  # tracked as CU-380's open item rather than guessed here.
  nearfield_enabled: 0
readout:
  adc_bits: 16
  full_well_capacity_e: 2000000.0
  gain_e_per_dn: 32.0
  read_noise_e_rms: 5.0
source:
  scene_type: extended
  target:
    emissivity: 0.99
    temperature: 350.0
spectral_integration:
  filter_min_um: 3.5
  filter_max_um: 5.0
  integration_time_s: 0.001
