# RADIANT config — schema v1
# Minimal MWIR LEO extended-scene scenario.
# 300 K target, nadir view at 8 km altitude, midlat summer atmosphere.
# Matches the reference case in tests/integration/test_chain_extended.py.

source:
  target:
    temperature: 300.0        # K
    emissivity: 0.95

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 8000.0   # m

optics:
  aperture_diameter_m: 0.30   # m
  focal_length_m: 1.20        # m  (f/4.0)
  transmission_scalar: 0.70
  # Warm-optics self-emission is deliberately OFF (CU-380). This file is the
  # *minimal* valid config, and a warm-optics term needs a full
  # `optical_elements:` train with a temperature on every surface — which is no
  # longer minimal. Scalar transmission cannot carry the term regardless (a
  # synthesized lump has no Kirchhoff emissivity), so this line changes no
  # number; it states the omission instead of leaving it silent.
  #
  # The omission is NOT negligible: declaring this same net τ = 0.70 as two
  # 290 K mirrors adds 4.65e5 e- of warm-optics background — 37 % of signal —
  # and moves SNR from 1124 to 961. Copy this file as a starting point, but
  # declare a real train before trusting a thermal-band SNR.
  nearfield_enabled: 0

detector:
  pixel_pitch_x_um: 18.0      # um
  pixel_pitch_y_um: 18.0      # um
  qe_value: 0.70
  dark_rate_e_per_s: 100.0    # e-/s

spectral_integration:
  filter_min_um: 3.5           # um
  filter_max_um: 5.0           # um
  integration_time_s: 0.005    # s  (5 ms)

readout:
  read_noise_e_rms: 5.0       # e- RMS
  gain_e_per_dn: 32.0         # e-/DN (sized for FWC/2^16)
  adc_bits: 16
  full_well_capacity_e: 2000000.0  # e- (2 Me-, typical MWIR HgCdTe)
