# RADIANT mission template — Airborne LWIR Surveillance
# A surveillance aircraft imaging extended terrain in the LWIR from 8 km.
# 290 K ground (ε 0.95, natural terrain), 8–12 µm, the LWIR detector chain of
# the maritime template (25 µm, 65 K, 20 Me- well) behind a 20 cm f/3 optic —
# a general wide-area thermal mapper.
_radiant:
  format: 1
  template:
    name: "Airborne LWIR Surveillance"
    blurb: "Wide-area thermal imaging of extended terrain from an 8 km platform."
    specs: "LWIR 8–12 µm · 8 km airborne · extended scene"
    tune_next:
      - geometry.sensor_altitude_m
      - optics.aperture_diameter_m
      - source.target.temperature
      - spectral_integration.integration_time_s
      - atmosphere.visibility_km
atmosphere:
  model: simple
  standard_atmosphere: midlat_summer
  aerosol_type: rural
  visibility_km: 23.0
detector:
  dark_rate_e_per_s: 1.0e6
  detector_temperature_K: 65.0
  pixel_pitch_x_um: 25.0
  pixel_pitch_y_um: 25.0
  qe_value: 0.75
geometry:
  sensor_altitude_m: 8000.0
optics:
  aperture_diameter_m: 0.20
  focal_length_m: 0.60
  # Warm-optics self-emission is modelled from a declared train (CU-380).
  # Two reflective surfaces at R = sqrt(0.75) = 0.866025 reproduce the net
  # throughput this file previously declared as `transmission_scalar: 0.75`,
  # so the SCENE signal is unchanged; what is new is that each mirror now
  # EMITS, since Kirchhoff gives a mirror eps = 1 - R = 0.133975.
  #
  # temperature_K below is a STARTING POINT for this platform class
  # (airborne (8 km) — uncooled instrument near ambient), not a claim about any specific
  # instrument. Set it to your optics' actual temperature — in a thermal
  # band it is usually the dominant background, so it is the single most
  # important number in this file after the aperture.
readout:
  adc_bits: 14
  full_well_capacity_e: 2.0e7
  gain_e_per_dn: 1220.0
  read_noise_e_rms: 500.0
source:
  scene_type: extended
  target:
    emissivity: 0.95
    temperature: 290.0
spectral_integration:
  filter_min_um: 8.0
  filter_max_um: 12.0
  integration_time_s: 0.0002   # s — LWIR flux fills ~half the 20 Me- well

optical_elements:
  - {name: M1, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.866025, temperature_K: 290.0}
  - {name: M2, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.866025, temperature_K: 290.0}
