name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (ruff + mypy + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: mypy --strict on core + api
        run: mypy --strict src/radiant/core src/radiant/api
      - name: Import contracts
        run: lint-imports --config pyproject.toml

  fast-tests:
    name: Fast tests (level0 + level1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest level0 (analytic identities)
        run: pytest -m level0 --strict-markers -q
      - name: pytest level1 (module composition)
        run: pytest -m level1 --strict-markers -q

  integration-tests:
    name: Integration tests (level2)
    runs-on: ubuntu-latest
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest level2 (full RadiantSession.run)
        run: pytest -m level2 --strict-markers -q

  golden:
    name: Golden regression (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest golden (frozen-snapshot regression)
        run: pytest -m golden --strict-markers -q
