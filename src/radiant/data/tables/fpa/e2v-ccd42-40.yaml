    title: "CCD42-40 Ceramic AIMO Back Illuminated Compact Package High Performance CCD Sensor (A1A-100012 Version 9)"
    publisher: e2v technologies (uk) limited
    year: 2016
    url: "http://web.archive.org/web/20211207011528/https://www.teledyne-e2v.com/shared/content/resources/File/documents/Imaging%202017/CCDs%20-%20Full-Frame%20Spectroscopic%20%26%20Scientific/CCD42-40/3.%20BI,%20AIMO/1208.pdf"
    file: e2v_ccd42_40_bi_aimo_datasheet_2016.pdf
