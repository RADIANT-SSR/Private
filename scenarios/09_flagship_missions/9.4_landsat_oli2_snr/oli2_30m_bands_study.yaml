# RADIANT config — schema v1 — CONFIGURATION SET (load with ConfigurationSet.load,
# `radiant run <file> --configuration <name>`, or GUI File → Open).
#
# External-validation scenario 9.4: Landsat 9 OLI-2, all eight 30 m bands as ONE
# multi-configuration study (ADR-0010). One shared instrument — telescope, per-element
# coated optics, FPA, readout — with per-band values only where the bands genuinely
# differ (radiance, band edges, QE, dark rate). That is the point of the model: the
# study states what differs, not what is repeated.
#
# Provenance (every value cited): docs/validation/landsat_oli2_source_data.md
# Requirements/L_typ per band [Irons 2012]; design [Knight 2014]; L8 on-orbit SNR
# [Morfitt 2015]; OLI-2 [Barsi 2024]. Companion per-band configs (oli2_b0N_snr_ltyp.yaml)
# carry each band's own filter element; results agree (walkthrough §study-vs-standalone).
#
# THE FILTER TRICK (Gap 103 / ADR-0010 D-7): a study's optical_elements document is
# shared across all configurations, so the eight bands cannot each carry their own
# filter element. But OLI's real FPA filter is ONE butcher-block assembly — and the
# eight 30 m bands do not overlap spectrally. The shared element below is therefore the
# composite of all eight strips (pointwise union), and each configuration's band edges
# select its own strip — spectrally exact in-band, physically faithful to the hardware.
# The pan band (B8) overlaps green/red, cannot join the composite, and ships as the
# standalone oli2_b08_snr_ltyp.yaml (that file is Gap 103's re-audit instance).
#
# The panchromatic band also differs in pixel pitch (18 µm) and integration time
# (1.8 ms) — expressible as configured scalars, but its filter overlap alone forces the
# standalone file.

source:
  scene_type: extended            # uniform scene fills the pixel in every configuration
  target_location: auto

atmosphere:
  model: exo                      # vacuum — the requirement is defined at-aperture

geometry:
  sensor_altitude_m: 705000.0     # m — published orbit [Irons 2012]
  target_altitude_m: 0.0

optics:
  aperture_diameter_m: 0.135      # m — published (recalled ±5 mm) [Knight 2014]
  focal_length_m: 0.886           # m — published (recalled ±10 mm); GSD-self-consistent

detector:
  pixel_pitch_x_um: 36.0          # µm — published (recalled); all 30 m bands share the pitch
  pixel_pitch_y_um: 36.0

spectral_integration:
  integration_time_s: 3.6e-03     # s — published (recalled ±0.4 ms) [Knight 2014]; shared by all 30 m bands

readout:
  n_tdi: 1                        # pushbroom, no TDI
  read_noise_e_rms: 200.0         # e- RMS — assumption (envelope 100–400; shot-dominated at L_typ)
  full_well_capacity_e: 2000000.0 # e- — analysis mode: never clips at L_typ
  adc_bits: 14                    # — published (OLI-2) [Barsi 2024]
  gain_e_per_dn: 122.0703125      # e-/DN — full well / 2^14

# Shared per-element prescription (see the per-band files for field-level provenance).
# The one deliberate difference: filter_butcher_block replaces the per-band filter.
optical_elements:
  - {name: M1, transfer_mode: REFLECTIVE, kind: MIRROR, reflectance: data/mirror_protected_ag.csv,
     temperature_K: 293.0, diameter_m: 0.15, distance_to_fpa_m: 0.90}
  - {name: M2, transfer_mode: REFLECTIVE, kind: MIRROR, reflectance: data/mirror_protected_ag.csv,
     temperature_K: 293.0, diameter_m: 0.06, distance_to_fpa_m: 0.70}
  - {name: M3, transfer_mode: REFLECTIVE, kind: MIRROR, reflectance: data/mirror_protected_ag.csv,
     temperature_K: 293.0, diameter_m: 0.10, distance_to_fpa_m: 0.50}
  - {name: M4, transfer_mode: REFLECTIVE, kind: MIRROR, reflectance: data/mirror_protected_ag.csv,
     temperature_K: 293.0, diameter_m: 0.08, distance_to_fpa_m: 0.30}
  - {name: fpa_window, transfer_mode: REFRACTIVE, kind: WINDOW, transmittance: data/fpa_window_ar.csv,
     temperature_K: 240.0, diameter_m: 0.05, distance_to_fpa_m: 0.02}
  - {name: filter_butcher_block, transfer_mode: REFRACTIVE, kind: FILTER,
     transmittance: data/filter_butcher_block.csv,
     temperature_K: 210.0, diameter_m: 0.05, distance_to_fpa_m: 0.005}

configurations:
  names: [B1_CA, B2_Blue, B3_Green, B4_Red, B5_NIR, B6_SWIR1, B7_SWIR2, B9_Cirrus]
  active: B4_Red
  baseline: B4_Red
  parameters:
    # Flat L_typ per band [W/m²/sr/µm at authoring time — CSVs carry canonical units]:
    #   40, 40, 30, 22, 14, 4.0, 1.7, 6.0 [Irons 2012]
    source.target.user_radiance_path:
      [data/l_typ_b01.csv, data/l_typ_b02.csv, data/l_typ_b03.csv, data/l_typ_b04.csv,
       data/l_typ_b05.csv, data/l_typ_b06.csv, data/l_typ_b07.csv, data/l_typ_b09.csv]
    # Published 50% band edges [µm] [Irons 2012] — each selects its butcher-block strip:
    spectral_integration.filter_min_um: [0.435, 0.452, 0.533, 0.636, 0.851, 1.566, 2.107, 1.363]
    spectral_integration.filter_max_um: [0.451, 0.512, 0.590, 0.673, 0.879, 1.651, 2.294, 1.384]
    # Band-average QE — ASSUMPTION (±0.15): Si PIN (B1–B5), HgCdTe (B6, B7, B9):
    detector.qe_value: [0.70, 0.80, 0.85, 0.87, 0.78, 0.80, 0.75, 0.80]
    # Dark rate [e-/s] — assumption; Si PIN negligible, HgCdTe modest at 210 K FPA:
    detector.dark_rate_e_per_s: [100.0, 100.0, 100.0, 100.0, 100.0, 5.0e4, 5.0e4, 5.0e4]
