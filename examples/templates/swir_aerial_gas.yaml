# RADIANT template: swir_aerial_gas
# Airborne SWIR gas detection — 0.12m aperture, 2.0–2.5 µm
# Methane/CO₂ plume detection from low altitude.

source:
  target:
    temperature: 300.0        # K
    emissivity: 0.85

atmosphere:
  standard_atmosphere: midlat_summer

geometry:
  sensor_altitude_m: 1000.0   # m

optics:
  aperture_diameter_m: 0.12   # m
  focal_length_m: 0.36        # m  (f/3.0)
  transmission_scalar: 0.72

detector:
  pixel_pitch_x_um: 20.0      # µm
  pixel_pitch_y_um: 20.0      # µm
  qe_value: 0.70
  dark_rate_e_per_s: 80.0     # e-/s

spectral_integration:
  filter_min_um: 2.0           # µm
  filter_max_um: 2.5           # µm
  integration_time_s: 0.012    # s

readout:
  read_noise_e_rms: 6.0       # e- RMS
  gain_e_per_dn: 1.0          # e-/DN
  adc_bits: 14
