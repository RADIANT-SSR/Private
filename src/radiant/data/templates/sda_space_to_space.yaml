# RADIANT mission template — SDA Space-to-Space
# Space-domain awareness: a LEO sensor tracking a sunlit-free (night-side)
# thermal point object near GEO through vacuum. Values derive from the
# owner-validated scenario 10.4 (LEO→GEO exo family): 280 K / ε 0.85 bus with
# 20 m² projected area, 0.35 m obscured telescope, low-noise 14-bit readout,
# slow LOS rate for a near-geosynchronous object.
# Scalar-τ optics carry no near-field emission (Gap 127): warm-optics
# self-emission requires a defined element list (optical_elements:).
_radiant:
  format: 1
  template:
    name: "SDA Space-to-Space"
    blurb: "LEO sensor tracking a thermal point object near GEO through vacuum."
    specs: "MWIR 3.5–5 µm · LEO→GEO exo path · point source"
    tune_next:
      - geometry.target.projected_area_m2
      - source.target.temperature
      - geometry.target_altitude_m
      - optics.aperture_diameter_m
      - spectral_integration.integration_time_s
atmosphere:
  model: exo
detector:
  dark_rate_e_per_s: 1000.0
  detector_temperature_K: 80.0
  pixel_pitch_x_um: 18.0
  pixel_pitch_y_um: 18.0
  qe_value: 0.75
geometry:
  los_angular_rate_rad_s: 1.2870938232603674e-06
  path_zenith_rad: 0.0
  scene_class: space_to_space
  sensor_altitude_m: 500000.0
  solar_illumination: night
  target:
    projected_area_m2: 20.0
  target_altitude_m: 35786000.0
optics:
  aperture_diameter_m: 0.35
  focal_length_m: 2.1
  obscuration_ratio: 0.25
  # Warm-optics self-emission is modelled from a declared train (CU-380).
  # Two reflective surfaces at R = sqrt(0.6) = 0.774597 reproduce the net
  # throughput this file previously declared as `transmission_scalar: 0.6`,
  # so the SCENE signal is unchanged; what is new is that each mirror now
  # EMITS, since Kirchhoff gives a mirror eps = 1 - R = 0.225403.
  #
  # temperature_K below is 150 K, and that is a DELIBERATE DEPARTURE from the
  # 280 K bus-ambient default used by the other LEO templates — because this
  # case cannot work at 280 K. Measured sweep on this very scene (MWIR
  # 3.5-5.0 um, point source against cold space):
  #
  #     T_optics    nearfield_e    signal_e     SNR
  #       280 K       2.008e+07        1296    0.00  well saturated
  #       250 K       5.167e+06        1296    0.00  well saturated
  #       200 K       2.270e+05        1296    0.00  well saturated
  #       180 K       4.082e+04        1296    6.23  background-limited
  #       150 K       1.364e+03        1296   21.05  background-limited
  #       120 K       8.835e+00        1296   26.27  signal-dominated
  #
  # So a MWIR point-source space-surveillance instrument REQUIRES deeply cooled
  # optics; at bus-ambient temperature the warm optics outruns the target by
  # four orders of magnitude and the well saturates on self-emission alone.
  # That is a design conclusion, not a modelling artefact, and it is the most
  # useful thing this template can teach. 150 K is reachable by passive
  # radiative cooling behind a sunshade, with no active cryocooler implied;
  # the case is then honestly background-limited, which is the regime an SDA
  # analyst should be reasoning in. Set it to your instrument's real value.
  wfe_rms_waves: 0.05
performance:
  detection_snr_threshold: 5.0
readout:
  adc_bits: 14
  full_well_capacity_e: 100000.0
  gain_e_per_dn: 6.1
  read_noise_e_rms: 25.0
source:
  scene_type: point_source
  target:
    emissivity: 0.85
    temperature: 280.0
spectral_integration:
  filter_min_um: 3.5
  filter_max_um: 5.0
  integration_time_s: 0.5    # s — a tracking stare; clears the 5.0 detection threshold

optical_elements:
  - {name: M1, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.774597, temperature_K: 150.0}
  - {name: M2, transfer_mode: REFLECTIVE, kind: MIRROR,
     reflectance: 0.774597, temperature_K: 150.0}
