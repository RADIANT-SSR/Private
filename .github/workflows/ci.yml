name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (ruff + mypy + import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/
      - name: mypy --strict on core + api
        run: mypy --strict src/radiant/core src/radiant/api
      - name: Import contracts
        run: lint-imports --config pyproject.toml
      - name: Organization rules (OPERATING_MODEL placement + naming)
        run: python scripts/check_org_rules.py
      - name: Physics-module conversion/constant lint (Rules 2 + 13)
        run: python scripts/check_physics_conversions.py
      - name: pytest.approx tolerance lint (Rule 18)
        run: python scripts/check_approx_tolerances.py

  fast-tests:
    name: Fast tests (level0 + level1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest level0 (analytic identities)
        run: pytest -m level0 --strict-markers -q
      - name: pytest level1 (module composition)
        run: pytest -m level1 --strict-markers -q

  integration-tests:
    name: Integration tests (level2)
    runs-on: ubuntu-latest
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest level2 (full RadiantSession.run)
        run: pytest -m level2 --strict-markers -q

  gui-tests:
    name: Geometry GUI v2 tests
    runs-on: ubuntu-latest
    needs: fast-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Qt/VTK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1 libglx-mesa0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
      - name: Install package + GUI module
        run: |
          pip install -e ".[dev]"
          pip install -e dev_tools/geometry_gui_v2
      - name: pytest geometry_gui_v2 (under Xvfb)
        # CU-042: the suite selects the platform-native Qt plugin (xcb on
        # Linux), so it needs a display server. Screenshot-baseline tests
        # (golden_phase1) use a pixel-divergence tolerance; if llvmpipe
        # rendering drifts past it on this runner, recalibrate the baseline
        # per RADIANT_Testing_Validation §5.3 rather than loosening the test.
        run: xvfb-run -a python -m pytest dev_tools/geometry_gui_v2 -q

  golden:
    name: Golden regression (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[dev]"
      - name: pytest golden (frozen-snapshot regression)
        run: pytest -m golden --strict-markers -q
