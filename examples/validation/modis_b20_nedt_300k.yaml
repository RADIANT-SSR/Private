# RADIANT config — schema v1
# External-validation scenario: MODIS (Aqua) TEB B20 @ 300 K.
# Provenance: docs/validation/modis_teb_source_data.md; canonical comparison:
# scripts/run_external_validation.py; results: docs/reports/external_validation_2026-07/
#   Published L_typ = 0.45 W/m²/sr/µm (matches RADIANT band-avg Planck to <=0.1%);
#   NEdT spec 50 mK; Aqua measured 20 mK (detector-noise-limited — the photon
#   floor is a bound, not a prediction; see Findings §3).
# Signal stays below the well maximum; chain outputs are valid (NEdT here is the
# photon+read+ADC floor — the measured 20 mK is detector-noise-limited).

source:
  scene_type: extended
  target:
    temperature: 300.0           # K
    emissivity: 1.0

atmosphere:
  model: exo

geometry:
  sensor_altitude_m: 705000.0    # m — published orbit
  target_altitude_m: 0.0

optics:
  aperture_diameter_m: 0.1778    # m — published
  focal_length_m: 0.380859       # m — published system EFL (SMIR FPA)
  transmission_scalar: 0.40      # - ASSUMPTION (envelope 0.30–0.50; LUT-internal)

detector:
  pixel_pitch_x_um: 540.0         # µm — published (540 µm SMIR)
  pixel_pitch_y_um: 540.0
  qe_value: 0.7                  # - ASSUMPTION (PV eta 0.6–0.8)
  dark_rate_e_per_s: 1.0e6       # e-/s — assumption; sub-dominant

spectral_integration:
  filter_min_um: 3.66           # µm — published band edges
  filter_max_um: 3.84
  integration_time_s: 3.233330e-04  # s — published (323.333 µs frame sample)

readout:
  read_noise_e_rms: 500.0        # e- RMS — assumption; sub-dominant
  full_well_capacity_e: 2.0e7    # e- — sized ~3x the 300 K signal so the 12-bit
                                 # quantization step is realistic (actual per-band
                                 # analog gain is unpublished)
  adc_bits: 12                   # — published
  gain_e_per_dn: 4882.8125       # e-/DN — well / 2^12
